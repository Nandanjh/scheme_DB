    return '<option value="' + s + '"' + (sel === s ? " selected" : "") + '>' + s + '</option>';
  }).join("");
}
function filterCustomers(){
  var f = state.cust, q = f.q.trim().toLowerCase();
  var from = parseISO(f.from), to = parseISO(f.to);
  return visibleCustomers().filter(function(c){
    if (q && (c.name + " " + c.mobile + " " + c.id + " " + c.email).toLowerCase().indexOf(q) < 0) return false;
    if (f.scheme && c.schemeId !== f.scheme) return false;
    if (f.status && c.status !== f.status) return false;
    if (from && c.startDate < from) return false;
    if (to && c.startDate > to) return false;
    return true;
  });
}
function sortCustomers(list){
  var k = state.cust.sort, d = state.cust.dir === "asc" ? 1 : -1;
  return list.slice().sort(function(a, b){
    var v = 0;
    if (k === "name")       v = a.name.localeCompare(b.name);
    else if (k === "amount")v = a.monthlyAmount - b.monthlyAmount;
    else if (k === "inst")  v = (a.installmentsPaid / a.totalInstallments) - (b.installmentsPaid / b.totalInstallments);
    else if (k === "start") v = a.startDate - b.startDate;
    else if (k === "end")   v = a.endDate - b.endDate;
    else if (k === "status")v = a.status.localeCompare(b.status);
    else if (k === "scheme")v = schemeById[a.schemeId].name.localeCompare(schemeById[b.schemeId].name);
    return v * d || a.name.localeCompare(b.name);
  });
}
function filterPayments(){
  var f = state.pay, q = f.q.trim().toLowerCase();
  var from = parseISO(f.from), to = parseISO(f.to);
  return visiblePayments().filter(function(p){
    if (f.scheme && p.schemeId !== f.scheme) return false;
    if (f.status && p.status !== f.status) return false;
    if (from && p.sortDate < from) return false;
    if (to && p.sortDate > to) return false;
    if (q){
      var c = customerById[p.customerId];
      var hay = (c.name + " " + c.mobile + " " + c.id + " " + (p.transactionId || "")).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });
}
function sortPayments(list){
  var k = state.pay.sort, d = state.pay.dir === "asc" ? 1 : -1;
  return list.slice().sort(function(a, b){
    if (k === "recent"){
      if (a.settled !== b.settled) return a.settled ? -1 : 1;
      return a.settled ? (b.sortDate - a.sortDate) : (a.sortDate - b.sortDate);
    }
    var v = 0;
    if (k === "date")        v = a.sortDate - b.sortDate;
    else if (k === "cust")   v = customerById[a.customerId].name.localeCompare(customerById[b.customerId].name);
    else if (k === "scheme") v = schemeById[a.schemeId].name.localeCompare(schemeById[b.schemeId].name);
    else if (k === "inst")   v = a.installmentNumber - b.installmentNumber;
    else if (k === "amount") v = a.amount - b.amount;
    else if (k === "status") v = a.status.localeCompare(b.status);
    return v * d || (b.sortDate - a.sortDate);
  });
}
function activeChips(kind){

  return '<div class="filter-chips">' + chips.map(function(c){
      return '<span class="fchip">' + h(c[1]) + ': <b>' + h(c[2]) + '</b>'
           + '<button data-act="clearFilter" data-kind="' + kind + '" data-k="' + c[0] + '" aria-label="Remove ' + h(c[1]) + ' filter">'

/* ══════════════════════════════════════════════════════════════════
   15b · PAGE — SETTLEMENTS
   A daily-updated, read-only ledger of collected payments, each
   carrying a bank UTR number. Grouped by the date they settled on, so
   the jeweller opens one day at a time and checks it against that
   day's bank statement. A range selector narrows which dates show up
   in the list — it never restricts what a chosen date shows.
   ══════════════════════════════════════════════════════════════════ */
function settleBounds(){
  return rangeBounds(state.settle.range, state.settle.customFrom, state.settle.customTo);
}
function settledPayments(){
  return visiblePayments().filter(function(p){ return p.status === "Paid" && p.settledOn; });
}
/* one row per calendar date that had at least one settlement, within
   the selected range — newest date first */
function settlementDays(){
  var b = settleBounds(), map = {};
  settledPayments().forEach(function(p){
    var d = dayStart(p.settledOn);
    if (d < b.from || d > b.to) return;
    var key = iso(d);
    if (!map[key]) map[key] = { key:key, date:d, count:0, amount:0 };
    map[key].count++; map[key].amount += p.amount;
  });
  return Object.keys(map).map(function(k){ return map[k]; }).sort(function(a, b){ return b.date - a.date; });
}
/* every settlement recorded on one specific date — independent of the
   range selector above, since opening a date always shows it in full */
function settlementDayRows(dayKey){
  return settledPayments().filter(function(p){ return iso(dayStart(p.settledOn)) === dayKey; })
    .sort(function(a, b){
      var ca = customerById[a.customerId], cb = customerById[b.customerId];
      return (ca ? ca.name : "").localeCompare(cb ? cb.name : "") || a.id.localeCompare(b.id);
    });
}
function viewSettlements(){
  var dayKey = state.route.id;
  if (!dayKey) return viewSettlementIndex();
  if (settlementDayRows(dayKey).length) return viewSettlementDay(dayKey);
  return notFound("Settlement date not found", "There's no settlement data recorded for this date.",
    "#/settlements", "Back to Settlements");
}
function viewSettlementIndex(){
  var b = settleBounds(), f = state.settle;
  return '<div class="page">'
    + (state.role === "staff" ? staffScopeNote() : "")
    + '<div class="page-head"><div><h1 class="page-title">Settlements</h1>'

      + readOnlyPill()
    + '</div></div>'

    + '<div class="toolbar">'
      + '<div class="tb-select"><label class="sr-only" for="settleRange">Date range</label>'
        + '<select id="settleRange" class="inp" style="width:172px" data-act="settleFilter" data-k="range">'
          + RANGE_UI.map(function(r){
              return '<option value="' + r.key + '"' + (f.range === r.key ? " selected" : "") + '>' + h(r.label) + '</option>'; }).join("")
        + '</select></div>'
      + (f.range === "custom"
          ? '<div class="tb-custom">'
            + '<input class="inp" type="date" data-act="settleFilter" data-k="customFrom" value="' + h(f.customFrom) + '" aria-label="Custom range start date">'
            + '<span>to</span>'
            + '<input class="inp" type="date" data-act="settleFilter" data-k="customTo" value="' + h(f.customTo) + '" aria-label="Custom range end date">'
            + '</div>'
          : "")
      + '<div class="tb-range">' + icon("calendar", 14)
        + 'Showing <b>' + h(rangeShowingLabel(f, b)) + '</b> · '
        + h(fmtDate(b.from)) + ' – ' + h(fmtDate(b.to)) + '</div>'
    + '</div>'

    + '<div class="section" id="tableZone">' + settlementIndexTable() + '</div>'
    + '</div>';
}
function settlementIndexTable(){
  var days = settlementDays();
  var per = perPage(), pages = Math.max(1, Math.ceil(days.length / per));
  if (state.settle.page > pages) state.settle.page = pages;
  var page = state.settle.page;
  var slice = days.slice((page - 1) * per, page * per);

  var body = slice.map(function(d){
    return '<tr class="clickable" tabindex="0" data-go="#/settlements/' + d.key + '" aria-label="Open settlements for ' + h(fmtDate(d.date)) + '">'
      + '<td><span style="font-weight:650">' + h(fmtDate(d.date)) + '</span></td>'
      + '<td class="num t-mono">' + num(d.count) + '</td>'
      + '<td class="num amt">' + inr(d.amount) + '</td>'
      + '<td class="num"><a class="btn btn-sm" href="#/settlements/' + d.key + '">Open ' + icon("chevRight", 13) + '</a></td>'
      + '</tr>';
  }).join("");

  var head = '<tr><th>Settlement Date</th><th class="num">Payments</th><th class="num">Amount</th><th class="num">&nbsp;</th></tr>';

  return '<div class="card">'
    + '<div class="card-head"><h3>Settlement dates</h3><span class="section-sub">Newest first</span></div>'
    + (days.length
        ? '<div class="tbl-wrap"><table class="tbl" style="min-width:600px"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>'
          + pager(days.length, page, per, "dates")
        : emptyState("No settlements in this range", "Try widening the date range above."))
    + '</div>';
}
function viewSettlementDay(dayKey){
  var d = parseISO(dayKey);

      + '<a class="c-link" href="#/settlements" style="display:inline-flex;align-items:center;gap:5px;margin-bottom:7px;font-size:12.5px;font-weight:600">'
        + icon("arrowLeft", 13) + 'All settlement dates</a>'
      + '<h1 class="page-title">' + h(fmtDate(d)) + '</h1>'
      + '<p class="page-sub">' + num(rows.length) + ' payment' + (rows.length === 1 ? "" : "s") + ' settled this day &middot; ' + inr(amount) + ' combined.</p></div>'
    + '<div class="page-head-actions">'
      + '<button class="btn" data-act="exportCsv" data-k="settleDay" data-id="' + h(dayKey) + '" data-tip="Download this date’s settlements as a CSV file">' + icon("download", 15) + 'Export CSV</button>'
      + readOnlyPill()
    + '</div></div>'
    + '<div class="section" id="tableZone">' + settlementDayTable(dayKey) + '</div>'
    + '</div>';
}
function settlementDayTable(dayKey){
  var rows = settlementDayRows(dayKey);
  var per = perPage(), pages = Math.max(1, Math.ceil(rows.length / per));
  if (state.settle.page > pages) state.settle.page = pages;

      + '<td>' + schemeChip(p.schemeId) + '</td>'
      + '<td class="num t-mono" style="white-space:nowrap">' + p.installmentNumber + ' <span class="t-muted">/ ' + p.totalInstallments + '</span></td>'
      + '<td class="num amt" style="white-space:nowrap">' + inr(p.amount) + '</td>'
      + '<td class="t-mono" style="white-space:nowrap">' + h(p.utr) + '</td>'
      + '<td class="t-muted" style="white-space:nowrap">' + h(p.mode) + '</td>'

  }).join("");

  var head = '<tr><th>Time</th><th>Customer</th><th>Customer ID</th><th>Scheme</th><th>Installment</th>'

  return '<div class="card">'

        : emptyState("No settlements found", "There's no settlement data recorded for this date."))
    + '</div>';
}

  if (state.schemePage > Math.max(1, Math.ceil(list.length / per))) state.schemePage = 1;
  var page = state.schemePage;
  var slice = list.slice((page - 1) * per, page * per);

  var rows = slice.map(function(c){

/* ══════════════════════════════════════════════════════════════════
   21 · ROUTER
   ══════════════════════════════════════════════════════════════════ */
function parseHash(){
  var raw = (location.hash || "#/overview").replace(/^#\/?/, "");
  var seg = raw.split("/").filter(Boolean);
  var name = seg[0] || "overview";
  var valid = { overview:1, customers:1, payments:1, settlements:1, schemes:1, users:1, settings:1 };
  if (!valid[name]) name = "overview";
  return { name: name, id: seg[1] ? decodeURIComponent(seg[1]) : null };
}
/* routes gated by a per-user feature toggle (see FEATURES/hasFeature) —
   "users" and "settings" are governed by role alone, not by a toggle */
var ROUTE_FEATURE = { overview:"overview", customers:"customers", payments:"payments",
                       settlements:"settlements", schemes:"schemes" };
function render(){
  state.route = parseHash();
  if (state.route.name === "users" && !can("usersPage")) { location.hash = "#/overview"; return; }
  if (ROUTE_FEATURE[state.route.name] && !hasFeature(ROUTE_FEATURE[state.route.name])) { location.hash = "#/settings"; return; }
  if (state.route.name === "settlements" && state.settle._id !== state.route.id){
    state.settle._id = state.route.id; state.settle.page = 1;
  }
  renderNav(); renderTopbar(); renderCrumbs();

  var html;
  switch (state.route.name){
    case "customers": html = state.route.id ? viewCustomer(state.route.id) : viewCustomers(); break;
    case "payments" : html = viewPayments(); break;
    case "settlements": html = viewSettlements(); break;
    case "schemes"  : html = state.route.id ? viewScheme(state.route.id) : viewSchemes(); break;
    case "users"    : html = viewUsers(); break;
    case "settings" : html = viewSettings(); break;
    default         : html = viewOverview();
  }
  $("#view").innerHTML = html;
  window.scrollTo(0, 0);
  closeNav(); hideTip();
}
function refreshTable(){
  var zone = $("#tableZone");
  if (!zone) return render();
  if (state.route.name === "payments") zone.innerHTML = paymentsTable();
  else if (state.route.name === "settlements") zone.innerHTML = state.route.id ? settlementDayTable(state.route.id) : settlementIndexTable();
  else zone.innerHTML = customersTable();
}
function go(hash){ if (location.hash === hash) render(); else location.hash = hash; }

}

function setPrefValue(k, v){

  if (k === "sparklines")  v = (v === "true" || v === true);

function toggleSetting(k){

document.addEventListener("click", function(e){
  /* dismiss popovers when clicking outside */
  if (state.open && !e.target.closest(".pop-wrap")){
    state.open = null;
    renderTopbar();
    if (state.route.name === "customers" && !state.route.id) { $("#view").innerHTML = viewCustomers(); }
    else if (state.route.name === "payments") { $("#view").innerHTML = viewPayments(); }
    else if (state.route.name === "settlements") { $("#view").innerHTML = viewSettlements(); }
  }

  var el = e.target.closest("[data-act]");
  if (el){
    var act = el.getAttribute("data-act");
    var kind = el.getAttribute("data-kind");

    if (act === "sort"){
      var key = el.getAttribute("data-key");
      var k = state.route.name === "payments" ? "pay" : "cust";
      if (state[k].sort === key) state[k].dir = state[k].dir === "asc" ? "desc" : "asc";
      else { state[k].sort = key; state[k].dir = (key === "name" || key === "cust" || key === "scheme" || key === "status") ? "asc" : "desc"; }
      state[k].page = 1; refreshTable(); return;
    }
    if (act === "page"){
      var n = Math.max(1, parseInt(el.getAttribute("data-page"), 10) || 1);
      if (state.route.name === "schemes"){ state.schemePage = n; render(); return; }
      var kk = state.route.name === "payments" ? "pay" : state.route.name === "settlements" ? "settle" : "cust";
      state[kk].page = n;
      refreshTable();
      var w = $(".tbl-wrap"); if (w) w.scrollTop = 0;
      return;
    }
    if (act === "toggleFilters"){ state.open = state.open === "filters" ? null : "filters"; render(); return; }
    if (act === "range"){ state.an.range = el.getAttribute("data-k"); hideTip(); render(); return; }
    if (act === "trend"){ state.an.trend = el.getAttribute("data-k"); hideTip(); render(); return; }
    if (act === "trendUnit"){ state.an.unit = el.getAttribute("data-k"); hideTip(); render(); return; }
    if (act === "schemeUnit"){ state.schemeChart.unit = el.getAttribute("data-k"); hideTip(); render(); return; }
    if (act === "payUnit"){ state.payChart.unit = el.getAttribute("data-k"); hideTip(); render(); return; }
    if (act === "setTab"){ state.setTab = el.getAttribute("data-k"); render(); return; }
    if (act === "setToggle"){ toggleSetting(el.getAttribute("data-k")); return; }
    if (act === "setPref" && el.hasAttribute("data-v")){ setPrefValue(el.getAttribute("data-k"), el.getAttribute("data-v")); return; }
    if (act === "exportSummary"){ exportSummaryCsv(); return; }
    if (act === "exportCsv"){
      var ek = el.getAttribute("data-k");
      if (ek === "customers") exportCustomersCsv();
      else if (ek === "settlements") exportSettlementsCsv();
      else if (ek === "settleDay") exportSettlementDayCsv(el.getAttribute("data-id"));
      else if (ek === "schemes") exportSchemesCsv();
      else if (ek === "scheme"){ exportSchemeCustomersCsv(el.getAttribute("data-id")); }
      else if (ek === "customer"){ exportCustomerHistoryCsv(el.getAttribute("data-id")); }
      else exportPaymentsCsv();
      return;
    }
    if (act === "resetDemo"){ location.reload(); return; }
    if (act === "setFilter"){ return; }
    if (act === "clearFilter"){
      state[kind][el.getAttribute("data-k")] = "";
      state[kind].page = 1; render(); return;
    }
    if (act === "resetFilters"){
      state[kind] = blankFilters(kind);
      state.open = null; render(); return;
    }
    if (act === "hist"){ state.hist = el.getAttribute("data-k"); render(); return; }
    if (act === "toggleMenu"){ state.open = state.open === "menu" ? null : "menu"; renderTopbar(); return; }
    if (act === "toggleNotif"){ state.open = state.open === "notif" ? null : "notif"; renderTopbar(); return; }
    if (act === "role"){
      var r = el.getAttribute("data-role");
      if (r !== state.role){
        state.role = r; state.open = null;
        state.cust = blankFilters("cust"); state.pay = blankFilters("pay");
        state.settle.page = 1;
        state.an.scheme = "";
        if (state.route.name === "users" && !can("usersPage")) { go("#/overview"); }
        else if (ROUTE_FEATURE[state.route.name] && !hasFeature(ROUTE_FEATURE[state.route.name])) { go("#/settings"); }
        else if (state.route.name === "customers" && state.route.id && !canSeeCustomer(state.route.id)) { go("#/customers"); }
        else render();
        toast("Now viewing as " + currentUser().role + " · " + currentUser().name);
      } else { state.open = null; renderTopbar(); }
      return;
    }
    if (act === "addUser"){ openModal(addUserModal(kind), { mode:"add", kind:kind }); return; }
    if (act === "featureToggle"){
      el.classList.toggle("on");
      el.setAttribute("aria-checked", el.classList.contains("on") ? "true" : "false");
      return;
    }
    if (act === "editAccess"){
      var euId = el.getAttribute("data-id");
      var eu = (kind === "admins" ? USERS.admins : USERS.staff).filter(function(x){ return x.id === euId; })[0];
      if (eu) openModal(editAccessModal(kind, eu), { mode:"access", kind:kind, id:euId });
      return;
    }
    if (act === "saveAccess"){
      var alist = modalCtx.kind === "admins" ? USERS.admins : USERS.staff;
      var ai = alist.map(function(x){ return x.id; }).indexOf(modalCtx.id);
      if (ai > -1){
        alist[ai].features = readFeatureToggles();
        var anm = alist[ai].name;
        closeModal(); render();
        toast("Updated feature access for " + anm);
      } else closeModal();
      return;
    }
    if (act === "revoke"){
      var id = el.getAttribute("data-id");
      var u = (kind === "admins" ? USERS.admins : USERS.staff).filter(function(x){ return x.id === id; })[0];
      if (u) openModal(revokeModal(kind, u), { mode:"revoke", kind:kind, id:id, name:u.name });
      return;
    }
    if (act === "confirmRevoke"){
      var list = modalCtx.kind === "admins" ? USERS.admins : USERS.staff;
      var i = list.map(function(x){ return x.id; }).indexOf(modalCtx.id);
      var nm = modalCtx.name;
      if (i > -1) list.splice(i, 1);
      ensureDemoUsers();
      closeModal(); render(); toast("Dashboard access revoked for " + nm, "warn"); return;
    }
    if (act === "submitUser"){ submitUser(); return; }
    if (act === "closeModal"){ closeModal(); return; }
    if (act === "copy"){
      var val = el.getAttribute("data-val");
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(val);
        else {
          var ta = document.createElement("textarea");
          ta.value = val; document.body.appendChild(ta); ta.select();
          document.execCommand("copy"); ta.remove();
        }
        toast("Copied " + val);
      } catch (err){ toast("Could not copy — " + val, "warn"); }
      return;
    }
    if (act === "logout"){ state.open = null; renderTopbar(); toast("Prototype — log out is not wired up.", "warn"); return; }
    if (act === "noop"){ state.open = null; renderTopbar(); toast("Prototype — this screen isn’t part of the demo.", "warn"); return; }
    if (act === "menu"){ $("#app").classList.add("nav-open"); $("#scrim").hidden = false; return; }
  }

  /* clickable table rows */
  var row = e.target.closest("tr[data-go]");
  if (row && !e.target.closest("a,button")){ go(row.getAttribute("data-go")); return; }

  if (e.target.closest("#scrim")) closeNav();
  if (e.target.closest("#btnMenu")){ $("#app").classList.add("nav-open"); $("#scrim").hidden = false; }
});

  if (e.key === "Enter" || e.key === " "){

    if (row && document.activeElement === row){ e.preventDefault(); go(row.getAttribute("data-go")); return; }
    var sortTh = e.target.closest && e.target.closest('th[data-act="sort"]');
    if (sortTh && document.activeElement === sortTh){ e.preventDefault(); sortTh.click(); return; }

    var s = $("#custSearch") || $("#paySearch") || $("#settleSearch");
    if (s){ e.preventDefault(); s.focus(); s.select(); }

});

function submitUser(){
  var name = ($("#uName") || {}).value || "";
  var mail = ($("#uMail") || {}).value || "";
  var scopeSel = $("#uScope");
  var err = $("#mErr");
  function fail(msg){ err.hidden = false; err.querySelector("div").textContent = msg; }
  name = name.trim(); mail = mail.trim();
  if (name.length < 2) return fail("Enter the person’s full name.");
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(mail)) return fail("Enter a valid work email address.");
  var all = USERS.admins.concat(USERS.staff).concat([USERS.owner]);
  if (all.some(function(u){ return u.email.toLowerCase() === mail.toLowerCase(); })) return fail("That email already has dashboard access.");

  var now = MONTHS[TODAY.getMonth()] + " " + TODAY.getFullYear();
  var features = readFeatureToggles();
  if (modalCtx.kind === "admins"){
    USERS.admins.push({ id:"U-ADM-" + (USERS.admins.length + 4), name:name, email:mail, role:"Admin",
                        status:"Invited", access:"Full operational access", added:now, features:features });
  } else {
    var v = scopeSel ? scopeSel.value : "all";
    USERS.staff.push({ id:"U-STF-" + (USERS.staff.length + 5), name:name, email:mail, role:"Staff",
                       status:"Invited", scope: v === "all" ? { type:"all" } : { type:"schemes", schemeIds:[v] },
                       added:now, features:features });
  }
  closeModal(); render();
  toast("Invite sent to " + mail);
}

/* Customers — a status meter above the table, reacting to the filters */
function customerStrip(rows){
  var active = 0, completed = 0, inactive = 0, monthly = 0, paidInst = 0, totalInst = 0;
  rows.forEach(function(c){
    if (c.status === "Active"){ active++; monthly += c.monthlyAmount; }
    else if (c.status === "Completed") completed++; else inactive++;
    paidInst += c.installmentsPaid; totalInst += c.totalInstallments;
  });
  var parts = [
    { name:"Active",    value:active,    color:STATUS_HEX.Active },
    { name:"Completed", value:completed, color:STATUS_HEX.Completed },
    { name:"Inactive",  value:inactive,  color:STATUS_HEX.Inactive }
  ];
  var prog = totalInst ? Math.round((paidInst / totalInst) * 100) : 0;
  return '<div class="strip">'
    + stripCell("users", "In view", num(rows.length), "")
    + stripCell("wallet", "Monthly commitment", inrShort(monthly), "pos")
    + stripCell("target", "Avg scheme progress", prog + "%", "")
    + '<div class="strip-bar"><div class="strip-lab">' + icon("activity", 13) + 'Status mix</div>'
      + miniStack(parts, rows.length)

          return '<span class="lg-item"><i style="background:' + p.color + '"></i><span class="lg-name">' + h(p.name)

    + '</div></div>';
}

               aria:"Amount collected per scheme", format:inrShort })
     + '<div style="flex:1;min-width:180px">' + legend(byAmt.map(function(m){
          return { color:m.color, name:m.name, value:inrShort(m.amount) }; }), { stack:true }) + '</div>'

/* Customer detail — money in versus the agreed schedule */
function customerTimeline(c, sm){
  var labels = [], paidCum = [], schedCum = [], accP = 0, accS = 0, notes = [];
  sm.rows.forEach(function(p){
    accS += p.amount;
    if (p.status === "Paid") accP += p.amount;
    labels.push(fmtMonth(p.dueDate));
    schedCum.push(accS); paidCum.push(accP);
    notes.push(p.status);
  });
  return '<section class="chart-card"><div class="chart-head">'
    + '<div><h3>Payment progress</h3><p>Money received against the agreed schedule</p></div>'
    + '<span class="spacer"></span>'
    + '<span class="chip">' + inr(sm.paidAmount) + ' of ' + inr(sm.totalValue) + '</span>'
    + '</div><div class="chart-body">'
    + areaChart({ labels:labels, values:paidCum, color:"var(--viz-brand)", seriesName:"Received",
                 refValues:schedCum, refColor:"var(--viz-1)",
                 format:inrAxis, formatFull:inr, width:700, height:228, minMax:sm.totalValue,
                 aria:"Cumulative amount received against the agreed schedule", maxXLabels:6,
                 extraRows:function(i){ return [["var(--viz-1)", "Scheduled by then", inr(schedCum[i])],
                                                ["", "Shortfall", inr(schedCum[i] - paidCum[i])]]; },
                 noteAt:function(i){ return "Instalment " + (i + 1) + " · " + notes[i]; } })
    + '</div>'
    + legend([{ color:"var(--viz-brand)", name:"Received to date", value:inr(sm.paidAmount) },
              { color:"var(--viz-1)", name:"Agreed schedule", value:inr(sm.totalValue) }])
    + '<div style="padding:10px 18px 16px"></div></section>';
}

/* Scheme detail — its own collections curve (day/week/month, scrollable
   once the buckets no longer fit at a readable bar width) and how far
   members have got (the same flush stacked-bar treatment as Overview's
   "Scheme progress" tile, just in the compact/vertical layout since this
   card is narrower) */
function schemeCharts(s, st){
  var pays = visiblePayments().filter(function(p){ return p.schemeId === s.id; });
  var unit = state.schemeChart.unit;
  var from = st.list.length
    ? st.list.reduce(function(min, c){ return c.startDate < min ? c.startDate : min; }, st.list[0].startDate)
    : addMonths(TODAY, -12);
  from = dayStart(from);
  var to = dayStart(TODAY);
  var col = seriesByUnit(pays, unit, from, to);

  /* a fixed per-bucket slot width, so switching to a finer granularity
     never squashes the bars — the chart just grows wider and the card
     scrolls horizontally instead. A card at typical widths shows this
     chart at roughly 600px, which is the floor below; past that the
     bars keep their slot width and the card scrolls instead of shrinking
     them, with a right-edge fade + hint hinting there's more to see. */
  var CARD_W = 600;
  var SLOT = { day:16, week:30, month:40 }[unit];
  var chartW = Math.max(CARD_W, col.n * SLOT + 66);
  var scrollable = chartW > CARD_W;
  var maxXLabels = Math.max(6, Math.floor(chartW / 90));

  var bands = progressBands(st.list);
  var unitBtn = function(u, label){
    return '<button data-act="schemeUnit" data-k="' + u + '"' + (unit === u ? ' class="on"' : "") + '>' + label + '</button>';
  };

  return '<div class="grid12" style="margin-top:0;margin-bottom:16px">'
   + '<section class="chart-card c7"><div class="chart-head">'
     + '<div><h3>Collections</h3><p>' + h(s.name) + ' · ' + h(fmtDate(from)) + ' – ' + h(fmtDate(to)) + ' · by ' + unit
       + (scrollable ? ' <span class="chart-scroll-hint">' + icon("arrowRight", 11) + ' scroll for full history</span>' : "") + '</p></div>'
     + '<span class="spacer"></span>'
     + '<div class="seg sm" role="group" aria-label="Collections granularity">'
       + unitBtn("day", "Day") + unitBtn("week", "Week") + unitBtn("month", "Month")
     + '</div></div>'
     + '<div class="chart-body">'
       + '<div class="chart-scroll-wrap' + (scrollable ? ' has-scroll' : "") + '">'
       + '<div class="chart-scroll"><div style="min-width:' + chartW + 'px">'
       + barChart({ labels:col.labels, values:col.values, color:SCHEME_HEX[s.id], seriesName:"Collected",
                   format:inrAxis, formatFull:inr, width:chartW, height:236, maxXLabels:maxXLabels,
                   aria:"Collections for this scheme, by " + unit,
                   extraRows:function(i){ return [["", "Instalments", num(col.counts[i])]]; } })
       + '</div></div></div>'
   + '</div></section>'
   + '<section class="chart-card c5"><div class="chart-head">'
     + '<div><h3>Member progress' + infoDot("How far each enrolled customer has got through this scheme's instalments, grouped into five stages. The bar below shows what share of all " + num(st.list.length) + " customers falls into each stage — “Complete” means every instalment is paid, whether or not they've redeemed yet.")
       + '</h3><p>How far through the scheme customers are</p></div></div>'
     + '<div class="chart-body pad">'
     + progressStackedBar(bands, st.list.length, {compact:true})
   + '</div></section></div>';
}

/* ══════════════════════════════════════════════════════════════════

  /* the trend chart's own granularity — day/week/month, independent of

  var trendCol = seriesByUnit(a.pays, f.unit, b.from, b.to);

  var trendW = Math.max(TREND_CARD_W, trendCol.n * TREND_SLOT + 66);
  var trendScrollable = trendW > TREND_CARD_W;
  var trendMaxXLabels = Math.max(6, Math.floor(trendW / 90));
  var trend = trendAmount
    ? areaChart({ labels:trendCol.labels, values:trendCol.values, color:"var(--viz-brand)", seriesName:"Collected",

   + '<div class="page-head">'

   + '<div class="kpis">' + kpis + '</div>'

   + '<div class="grid12">'

     /* collections trend */
     + '<section class="chart-card c8"><div class="chart-head">'
       + '<div><h3>Collections trend</h3><p>' + h(trendAmount ? "Amount received" : "Instalments received")

       + (trendScrollable ? ' <span class="chart-scroll-hint">' + icon("arrowRight", 11) + ' scroll for full history</span>' : "") + '</p></div>'
       + '<span class="spacer"></span>'

         + '<button data-act="trendUnit" data-k="month"' + (f.unit === "month" ? ' class="on"' : "") + '>Month</button>'
       + '</div>'

         + '<button data-act="trend" data-k="amount"' + (trendAmount ? ' class="on"' : "") + '>Amount</button>'

     /* scheme mix */

       + '<div><h3>Customers by scheme</h3><p>Where the book sits today</p></div></div>'

           return { color:m.color, name:m.name, value:num(m.value), sub:inrShort(m.amount) }; }), { stack:true })

function kpi(o){
  return '<div class="kpi">'
    + '<div class="kpi-top"><span class="kpi-label">' + h(o.label) + (o.info ? infoDot(o.info) : "") + '</span>'
    + '<span class="stat-ico ' + o.tone + '">' + icon(o.ico, 15) + '</span></div>'
    + '<div class="kpi-val">' + o.value + '</div>'
    + '<div class="kpi-meta">'
      + (o.delta !== undefined ? deltaBadge(o.delta, { invert:o.invert }) : "")
      + '<span class="kpi-note">' + o.note + '</span></div>'
    + (o.spark ? sparkline(o.spark, o.sparkColor, 112, 40) : "")
    + '</div>';
}
/* the Overview "New Enrolments" tile — a KPI card with its own period
   picker (Today / 1 week / 1 month / a custom range), independent of the
   page-level date range above it. Not built through kpi() since it needs
   a live control rather than a static note. */
function enrollKpiTile(f, b, n){
  var opts = [["today","Today"],["7d","Last 1 week"],["30d","Last 1 month"],["custom","Custom range…"]];
  var spanText = b.from.getTime() === b.to.getTime() ? fmtDate(b.from) : fmtDate(b.from) + ' – ' + fmtDate(b.to);
  return '<div class="kpi kpi-enroll">'
    + '<div class="kpi-top"><span class="kpi-label">New Enrolments'
      + infoDot("How many customers joined in the period you pick below — handy for spotting a slow week or checking today's sign-ups.")
      + '</span><span class="stat-ico blue">' + icon("userPlus", 15) + '</span></div>'
    + '<div class="kpi-val">' + num(n) + '</div>'
    + '<div class="kpi-meta"><span class="kpi-note">' + h(spanText) + '</span></div>'
    + '<div class="kpi-enroll-ctl">'

/* ══════════════════════════════════════════════════════════════════
   27 · PAGE — SETTINGS
   The Appearance / Formatting / Dashboard preferences below are real:
   changing one re-renders the app with it applied.

var SET_TABS = [

  var tabs = SET_TABS.filter(function(t){ return !t.needs || can(t.needs); });

  var nav = tabs.map(function(t){
    return '<button data-act="setTab" data-k="' + t.key + '"' + (state.setTab === t.key ? ' class="on" aria-current="true"' : "") + '>'

   + '<div class="set-wrap"><nav class="set-nav" aria-label="Settings sections">' + nav + '</nav>'

function setCard(title, desc, rows){

function setRow(title, desc, ctl){

function setSelect(key, val, opts){
  return '<select class="inp" data-act="setPref" data-k="' + key + '">'
    + opts.map(function(o){ return '<option value="' + o[0] + '"' + (String(val) === String(o[0]) ? " selected" : "") + '>' + h(o[1]) + '</option>'; }).join("")

function setSwitch(key, on, label){

function setSeg(key, val, opts){

/* ══════════════════════════════════════════════════════════════════
   28 · CSV EXPORT  (read-only — it never changes a record)
   ══════════════════════════════════════════════════════════════════ */
function csvCell(v){
  var s = String(v == null ? "" : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function downloadCsv(name, rows){
  var csv = rows.map(function(r){ return r.map(csvCell).join(","); }).join("\r\n");
  var blob = new Blob(["﻿" + csv], { type:"text/csv;charset=utf-8" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1200);
  toast("Downloaded " + name);
}
function exportCustomersCsv(){
  var rows = [["Customer ID","Name","Mobile","Email","Scheme","Scheme Type","Monthly Amount",
               "Installments Paid","Total Installments","Start Date","End Date","Status"]];
  visibleCustomers().forEach(function(c){
    var s = schemeById[c.schemeId];
    rows.push([c.id, c.name, c.mobile, c.email, s.name, s.type,
               c.monthlyAmount, c.installmentsPaid, c.totalInstallments,
               fmtDate(c.startDate), fmtDate(c.endDate), c.status]);
  });
  downloadCsv("gullak-customers.csv", rows);
}
function exportPaymentsCsv(){
  var rows = [["Transaction ID","Customer ID","Customer","Scheme","Installment","Total Installments",
               "Due Date","Payment Date","Payment Time","Amount","Mode","Status","UTR Number"]];
  visiblePayments().forEach(function(p){
    var c = customerById[p.customerId];
    rows.push([p.transactionId || "", c.id, c.name, schemeById[p.schemeId].name,
               p.installmentNumber, p.totalInstallments, fmtDate(p.dueDate),
               p.paymentDate ? fmtDate(p.paymentDate) : "", fmtTime(p.paymentTime) === "—" ? "" : fmtTime(p.paymentTime),
               p.amount, p.mode || "", p.status, p.utr || ""]);
  });
  downloadCsv("gullak-payments.csv", rows);
}
function exportSettlementsCsv(){
  var b = settleBounds();
  var rows = [["Settlement Date","Settlement Time","Customer ID","Customer","Scheme","Installment","Total Installments",
               "Amount","Mode","UTR Number","Transaction ID"]];
  settledPayments().filter(function(p){
    var d = dayStart(p.settledOn);
    return d >= b.from && d <= b.to;
  }).sort(function(a, b2){ return b2.settledOn - a.settledOn; }).forEach(function(p){
    var c = customerById[p.customerId];
    rows.push([fmtDate(p.settledOn), fmtTime(p.paymentTime) === "—" ? "" : fmtTime(p.paymentTime),
               c.id, c.name, schemeById[p.schemeId].name,
               p.installmentNumber, p.totalInstallments, p.amount, p.mode || "",
               p.utr || "", p.transactionId || ""]);
  });
  downloadCsv("gullak-settlements-" + iso(b.from) + "-to-" + iso(b.to) + ".csv", rows);
}

/* ══════════════════════════════════════════════════════════════════
   29 · CHART HOVER LAYER
   One delegated listener, so charts keep working across re-renders.
   ══════════════════════════════════════════════════════════════════ */
function chartTipHtml(d){
  return (d.t ? '<div class="tt-title">' + h(d.t) + '</div>' : "")
    + d.r.map(function(r){
        return '<div class="tt-row">' + (r[0] ? '<i style="background:' + r[0] + '"></i>' : "")
          + '<span class="k">' + h(r[1]) + '</span><span class="v">' + h(r[2]) + '</span></div>'; }).join("")
    + (d.n ? '<div class="tt-note">' + h(d.n) + '</div>' : "");
}
function placeTip(e){
  var tip = document.getElementById("chartTip");
  var r = tip.getBoundingClientRect();
  var x = e.clientX + 14, y = e.clientY - r.height - 12;
  if (x + r.width > window.innerWidth - 8) x = e.clientX - r.width - 14;
  if (y < 8) y = e.clientY + 18;
  tip.style.left = Math.max(8, x) + "px";
  tip.style.top  = Math.max(8, y) + "px";
}
function hideTip(){
  var tip = document.getElementById("chartTip");
  tip.className = ""; tip.setAttribute("aria-hidden", "true");
  $$(".viz .crosshair").forEach(function(el){ el.style.opacity = 0; });
  $$(".viz .focus-dot").forEach(function(el){ el.style.opacity = 0; });
  $$(".viz.dim-others").forEach(function(el){ el.classList.remove("dim-others"); });
  $$(".viz .mark.on, .viz .arc.on").forEach(function(el){ el.classList.remove("on"); });
}
document.addEventListener("mouseover", function(e){
  var m = e.target.closest && e.target.closest("[data-tip-json]");
  if (!m) return;
  var data;
  try { data = JSON.parse(m.getAttribute("data-tip-json")); } catch (err){ return; }
  var tip = document.getElementById("chartTip");
  tip.innerHTML = chartTipHtml(data);
  tip.className = "on"; tip.setAttribute("aria-hidden", "false");
  placeTip(e);

  var svg = m.closest(".viz");
  var g = m.closest("g");
  if (g){
    var ch = g.querySelector(".crosshair"), dot = g.querySelector(".focus-dot");
    if (ch) ch.style.opacity = 1;
    if (dot) dot.style.opacity = 1;
  }
  if (svg && m.classList.contains("arc")){
    svg.classList.add("dim-others");
    m.classList.add("on");
  }
});
document.addEventListener("mousemove", function(e){
  var tip = document.getElementById("chartTip");
  if (tip && tip.className === "on") placeTip(e);
});
document.addEventListener("mouseout", function(e){
  var m = e.target.closest && e.target.closest("[data-tip-json]");
  if (!m) return;
  var to = e.relatedTarget;
  if (to && to.closest && to.closest("[data-tip-json]") === m) return;
  hideTip();
});
window.addEventListener("scroll", hideTip, true);

/* ── info-icon tooltip (see #infoTip CSS + infoDot()) ────────────
   Fixed-position + JS-placed, so it is never clipped by an ancestor's
   overflow:hidden the way a CSS ::after bubble inside a .kpi card is. */
function placeInfoTip(el){
  var tip = document.getElementById("infoTip");
  var r = el.getBoundingClientRect();
  var tr = tip.getBoundingClientRect();
  var x = r.left + r.width / 2 - tr.width / 2;
  var y = r.top - tr.height - 10;
  if (y < 8) y = r.bottom + 10;
  x = Math.max(8, Math.min(x, window.innerWidth - tr.width - 8));
  tip.style.left = x + "px";
  tip.style.top  = y + "px";
}
function showInfoTip(el){
  var text = el.getAttribute("data-info");
  if (!text) return;
  var tip = document.getElementById("infoTip");
  tip.textContent = text;
  tip.className = "on"; tip.setAttribute("aria-hidden", "false");
  placeInfoTip(el);
}
function hideInfoTip(){
  var tip = document.getElementById("infoTip");
  tip.className = ""; tip.setAttribute("aria-hidden", "true");
}
document.addEventListener("mouseover", function(e){
  var m = e.target.closest && e.target.closest("[data-info]");
  if (!m) return;
  showInfoTip(m);
});
document.addEventListener("mouseout", function(e){
  var m = e.target.closest && e.target.closest("[data-info]");
  if (!m) return;
  var to = e.relatedTarget;
  if (to && to.closest && to.closest("[data-info]") === m) return;
  hideInfoTip();
});
document.addEventListener("focusin", function(e){
  var m = e.target.closest && e.target.closest("[data-info]");
  if (!m) return;
  showInfoTip(m);
});
document.addEventListener("focusout", function(e){
  var m = e.target.closest && e.target.closest("[data-info]");
  if (!m) return;
  hideInfoTip();
});
window.addEventListener("scroll", hideInfoTip, true);

})();

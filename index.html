<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Jeweller ERP · Gullak</title>
<meta name="description" content="Gullak Jeweller ERP — view customers, jewellery savings schemes, payments and scheme progress.">
<style>
/* ══════════════════════════════════════════════════════════════════
   GULLAK · JEWELLER ERP  —  design tokens
   ══════════════════════════════════════════════════════════════════ */
:root{
  --bg:#F4F5F8;
  --surface:#FFFFFF;
  --surface-2:#FAFBFC;
  --surface-3:#F3F4F7;
  --line:#E7E9EF;
  --line-2:#EFF1F5;
  --line-strong:#D7DBE3;

  --ink:#15171C;
  --ink-2:#464C58;
  --ink-3:#737A88;
  --ink-4:#9BA2B0;

  --brand:#A26F1F;
  --brand-2:#C79429;
  --brand-deep:#7A5113;
  --brand-tint:#FBF5E8;
  --brand-tint-2:#F4E8CE;

  --pos:#0C7A4D;      --pos-bg:#E6F6EE;  --pos-line:#C0E6D3;
  --warn:#96600A;     --warn-bg:#FDF3E2; --warn-line:#F1DCB3;
  --neg:#B42318;      --neg-bg:#FDECEA;  --neg-line:#F6CFCB;
  --info:#1D4ED8;     --info-bg:#EEF3FF; --info-line:#D5E1FE;
  --neutral:#5B6270;  --neutral-bg:#F1F2F5; --neutral-line:#E1E4EA;

  --r-sm:8px; --r-md:11px; --r-lg:14px; --r-xl:18px;
  --sh-xs:0 1px 2px rgba(17,24,39,.05);
  --sh-sm:0 1px 2px rgba(17,24,39,.05), 0 1px 3px rgba(17,24,39,.05);
  --sh-md:0 2px 4px rgba(17,24,39,.04), 0 6px 16px rgba(17,24,39,.06);
  --sh-lg:0 4px 10px rgba(17,24,39,.06), 0 20px 48px rgba(17,24,39,.14);
  --ring:0 0 0 3px rgba(162,111,31,.22);

  --sidebar-w:254px;
  --topbar-h:64px;
  --ease:cubic-bezier(.32,.72,.35,1);
}

/* ── reset ────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  font-variant-numeric:tabular-nums;
}
h1,h2,h3,h4,p,figure{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
table{border-collapse:collapse;width:100%}
a{color:inherit;text-decoration:none}
svg{display:block}
[hidden]{display:none !important}
::selection{background:var(--brand-tint-2);color:var(--brand-deep)}

:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#D3D7DF;border-radius:20px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#BFC4CE}

/* ── app frame ────────────────────────────────────────────────── */
.app{display:flex;min-height:100vh}
.scrim{position:fixed;inset:0;background:rgba(17,24,39,.34);backdrop-filter:blur(2px);z-index:60;opacity:0;transition:opacity .2s var(--ease)}
.app.nav-open .scrim{opacity:1}

/* ── sidebar ──────────────────────────────────────────────────── */
.sidebar{
  width:var(--sidebar-w);flex:none;background:var(--surface);
  border-right:1px solid var(--line);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;z-index:70;
}
.side-brand{padding:18px 18px 14px}
.brand{display:flex;align-items:center;gap:11px;border-radius:var(--r-md);padding:4px;margin:-4px;transition:background .15s}
.brand:hover{background:var(--surface-3)}
.brand-mark{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:11px;overflow:hidden;background:linear-gradient(145deg,#FBF3E1,#F3E3BF);box-shadow:inset 0 0 0 1px rgba(162,111,31,.16)}
.brand-mark img{width:100%;height:100%;object-fit:contain;padding:3px}
.brand-mark.has-img{background:transparent;box-shadow:none}
.brand-text{display:flex;flex-direction:column;min-width:0;gap:1px}
.brand-name{font-size:16.5px;font-weight:700;letter-spacing:-.022em;color:var(--ink);line-height:1.15}
.brand-sub{font-size:11px;font-weight:500;color:var(--ink-4);letter-spacing:.04em;text-transform:uppercase;line-height:1.15}

.nav{flex:1;overflow-y:auto;padding:6px 12px 12px;display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-4);padding:14px 10px 6px}
.nav-item{
  position:relative;display:flex;align-items:center;gap:11px;width:100%;
  padding:9px 11px;border-radius:9px;color:var(--ink-2);font-weight:500;font-size:13.5px;
  transition:background .14s var(--ease),color .14s var(--ease);text-align:left;
}
.nav-item svg{flex:none;color:var(--ink-4);transition:color .14s}
.nav-item:hover{background:var(--surface-3);color:var(--ink)}
.nav-item:hover svg{color:var(--ink-2)}
.nav-item.active{background:var(--brand-tint);color:var(--brand-deep);font-weight:600}
.nav-item.active svg{color:var(--brand)}
.nav-item.active::before{content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:3px;height:19px;border-radius:0 3px 3px 0;background:var(--brand)}
.nav-count{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--ink-4);background:var(--surface-3);padding:1px 7px;border-radius:20px}
.nav-item.active .nav-count{background:#FFF;color:var(--brand)}

.side-power{display:flex;align-items:center;gap:7px;padding:2px 18px 10px;font-size:10.5px;color:var(--ink-4);letter-spacing:.01em}
.side-power img,.side-power svg{width:14px;height:14px;flex:none;opacity:.6;border-radius:3px}
.side-power b{color:var(--ink-3);font-weight:650}
.side-foot{border-top:1px solid var(--line);padding:12px;display:flex;align-items:center;gap:10px}
.side-foot .avatar{flex:none}
.side-user{min-width:0;flex:1;display:flex;flex-direction:column}
.side-user-name{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.side-user-role{font-size:11px;color:var(--ink-4);font-weight:500;letter-spacing:.04em;text-transform:uppercase;line-height:1.4}

/* ── avatar ───────────────────────────────────────────────────── */
.avatar{
  display:grid;place-items:center;width:34px;height:34px;border-radius:50%;
  background:linear-gradient(145deg,#F6E9CE,#EBD5A5);color:var(--brand-deep);
  font-size:12.5px;font-weight:700;letter-spacing:.01em;
  box-shadow:inset 0 0 0 1px rgba(162,111,31,.18);
}
.avatar.sm{width:28px;height:28px;font-size:11px}
.avatar.lg{width:56px;height:56px;font-size:19px;border-radius:16px}
.avatar.neutral{background:linear-gradient(145deg,#EEF0F4,#E1E5EC);color:var(--ink-2);box-shadow:inset 0 0 0 1px rgba(17,24,39,.07)}

/* ── main column + topbar ─────────────────────────────────────── */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  height:var(--topbar-h);flex:none;position:sticky;top:0;z-index:40;
  background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 22px;
}
.crumbs{display:flex;align-items:center;gap:6px;min-width:0;font-size:13px;color:var(--ink-4)}
.crumbs .c-link{color:var(--ink-3);font-weight:500;border-radius:5px;padding:2px 4px;margin:-2px -4px;transition:color .14s,background .14s}
.crumbs .c-link:hover{color:var(--ink);background:var(--surface-3)}
.crumbs .c-cur{color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs svg{color:var(--ink-4);flex:none}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.biz{display:flex;flex-direction:column;align-items:flex-end;gap:2px;margin-right:4px;line-height:1.2}
.biz-name{font-size:13.5px;font-weight:650;color:var(--ink);letter-spacing:-.01em}
.biz-sub{font-size:11px;color:var(--ink-4)}

.icon-btn{
  position:relative;display:grid;place-items:center;width:34px;height:34px;border-radius:9px;
  color:var(--ink-3);transition:background .14s,color .14s;
}
.icon-btn:hover{background:var(--surface-3);color:var(--ink)}
.icon-btn.on{background:var(--surface-3);color:var(--ink)}
.dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:#D9532C;box-shadow:0 0 0 2px #fff}
.avatar-btn{border-radius:50%;transition:box-shadow .14s}
.avatar-btn:hover{box-shadow:0 0 0 3px var(--surface-3)}

/* ── view / page ──────────────────────────────────────────────── */
.view{flex:1;min-width:0;padding:26px 26px 64px;max-width:1500px;width:100%;overflow-x:clip}
.page{animation:viewIn .3s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

.page-head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-title{font-size:25px;font-weight:700;letter-spacing:-.028em;line-height:1.2}
.page-sub{font-size:13.5px;color:var(--ink-3);margin-top:4px}
.page-head-actions{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap}

.section{margin-top:26px}
.section-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.section-title{font-size:15px;font-weight:650;letter-spacing:-.012em}
.section-sub{font-size:12.5px;color:var(--ink-4)}
.section-head .spacer{margin-left:auto}

/* ── cards ────────────────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-xs)}
.card-head{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line-2)}
.card-head h3{font-size:14.5px;font-weight:650;letter-spacing:-.012em}
.card-head .spacer{margin-left:auto}
.card-body{padding:18px}
.card-foot{padding:12px 18px;border-top:1px solid var(--line-2);display:flex;align-items:center;gap:12px}

/* stat cards */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stats.three{grid-template-columns:repeat(3,1fr)}
.stat{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:17px 18px 16px;box-shadow:var(--sh-xs);transition:box-shadow .18s var(--ease),transform .18s var(--ease);
}
.stat:hover{box-shadow:var(--sh-sm);transform:translateY(-1px)}
.stat-top{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.stat-ico{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;flex:none}
.stat-ico.gold{background:var(--brand-tint);color:var(--brand)}
.stat-ico.green{background:var(--pos-bg);color:var(--pos)}
.stat-ico.blue{background:var(--info-bg);color:var(--info)}
.stat-ico.amber{background:var(--warn-bg);color:var(--warn)}
.stat-ico.grey{background:var(--neutral-bg);color:var(--neutral)}
.stat-ico.red{background:var(--neg-bg);color:var(--neg)}
.stat-label{font-size:12.5px;font-weight:550;color:var(--ink-3);letter-spacing:-.004em}
.stat-value{font-size:27px;font-weight:700;letter-spacing:-.035em;line-height:1.1;color:var(--ink)}
.stat-note{font-size:12px;color:var(--ink-4);margin-top:6px;display:flex;align-items:center;gap:5px}
.stat-note b{color:var(--ink-2);font-weight:600}

/* ── badges ───────────────────────────────────────────────────── */
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:2.5px 8px;border-radius:20px;
  font-size:11.5px;font-weight:600;letter-spacing:.005em;white-space:nowrap;border:1px solid transparent;
}
.badge::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex:none;opacity:.9}
.badge.nodot::before{display:none}
.b-paid,.b-active{background:var(--pos-bg);color:var(--pos);border-color:var(--pos-line)}
.b-pending{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.b-failed{background:var(--neg-bg);color:var(--neg);border-color:var(--neg-line)}
.b-completed{background:var(--info-bg);color:var(--info);border-color:var(--info-line)}
.b-inactive,.b-neutral{background:var(--neutral-bg);color:var(--neutral);border-color:var(--neutral-line)}
.b-invited{background:var(--brand-tint);color:var(--brand-deep);border-color:var(--brand-tint-2)}

.badge-role{
  display:inline-flex;align-items:center;padding:2px 7px;border-radius:5px;
  font-size:10px;font-weight:700;letter-spacing:.075em;text-transform:uppercase;
  background:var(--brand-tint);color:var(--brand-deep);border:1px solid var(--brand-tint-2);
}
.badge-role.admin{background:var(--info-bg);color:var(--info);border-color:var(--info-line)}
.badge-role.staff{background:var(--neutral-bg);color:var(--neutral);border-color:var(--neutral-line)}

.chip{
  display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:7px;
  font-size:12px;font-weight:550;background:var(--surface-3);color:var(--ink-2);border:1px solid var(--line);
}
.pill-ro{
  display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:600;
  background:var(--surface-3);color:var(--ink-3);border:1px solid var(--line);
}
.pill-ro svg{color:var(--ink-4)}

/* ── buttons ──────────────────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 13px;
  border-radius:9px;font-size:13px;font-weight:600;letter-spacing:-.005em;white-space:nowrap;
  border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);
  box-shadow:var(--sh-xs);transition:background .14s,border-color .14s,color .14s,box-shadow .14s,transform .08s;
}
.btn:hover{background:var(--surface-2);border-color:#C6CBD5;color:var(--ink)}
.btn:active{transform:translateY(.5px)}
.btn svg{flex:none}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 1px 2px rgba(122,81,19,.3)}
.btn-primary:hover{background:#946419;border-color:#946419;color:#fff}
.btn-ghost{border-color:transparent;background:transparent;box-shadow:none;color:var(--ink-3)}
.btn-ghost:hover{background:var(--surface-3);border-color:transparent;color:var(--ink)}
.btn-danger{color:var(--neg);border-color:var(--neg-line);background:var(--surface)}
.btn-danger:hover{background:var(--neg-bg);border-color:#EFBDB7;color:var(--neg)}
.btn-sm{height:29px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.on{background:var(--brand-tint);border-color:var(--brand-tint-2);color:var(--brand-deep)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.btn-back{
  display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 7px;border-radius:8px;
  font-size:13px;font-weight:550;color:var(--ink-3);margin-bottom:14px;transition:background .14s,color .14s;
}
.btn-back:hover{background:var(--surface-3);color:var(--ink)}

.link{color:var(--brand);font-weight:600;border-radius:5px;transition:color .14s}
.link:hover{color:var(--brand-deep);text-decoration:underline;text-underline-offset:2px}

/* ── inputs ───────────────────────────────────────────────────── */
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:10px;color:var(--ink-4);pointer-events:none}
.search input{
  height:34px;width:250px;padding:0 30px 0 32px;border-radius:9px;border:1px solid var(--line-strong);
  background:var(--surface);font-size:13px;transition:border-color .14s,box-shadow .14s;
}
.search input::placeholder{color:var(--ink-4)}
.search input:focus{outline:none;border-color:var(--brand);box-shadow:var(--ring)}
.search .clear{position:absolute;right:6px;display:grid;place-items:center;width:20px;height:20px;border-radius:5px;color:var(--ink-4)}
.search .clear:hover{background:var(--surface-3);color:var(--ink-2)}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--ink-2)}
.field .hint{font-size:11.5px;color:var(--ink-4)}
select.inp,input.inp{
  height:34px;padding:0 10px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);
  font-size:13px;width:100%;transition:border-color .14s,box-shadow .14s;
}
select.inp{
  appearance:none;padding-right:28px;cursor:pointer;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%239BA2B0' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 9px center;
}
input.inp:focus,select.inp:focus{outline:none;border-color:var(--brand);box-shadow:var(--ring)}
input[type=date].inp{padding-right:6px}

/* ── filter popover ───────────────────────────────────────────── */
.pop-wrap{position:relative}
.pop{
  position:absolute;top:calc(100% + 7px);right:0;z-index:50;min-width:290px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-lg);
  padding:15px;animation:popIn .16s var(--ease) both;
}
.pop.left{right:auto;left:0}
@keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.985)}to{opacity:1;transform:none}}
.pop-head{display:flex;align-items:center;margin-bottom:12px}
.pop-head h4{font-size:13px;font-weight:650}
.pop-head .spacer{margin-left:auto}
.pop-grid{display:grid;gap:12px}
.pop-foot{display:flex;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line-2)}
.pop-foot .btn{flex:1}
.range{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:7px}
.range span{color:var(--ink-4);font-size:12px}

.filter-chips{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.fchip{
  display:inline-flex;align-items:center;gap:6px;height:27px;padding:0 6px 0 10px;border-radius:7px;
  font-size:12px;font-weight:550;background:var(--brand-tint);color:var(--brand-deep);border:1px solid var(--brand-tint-2);
}
.fchip b{font-weight:700}
.fchip button{display:grid;place-items:center;width:17px;height:17px;border-radius:4px;color:var(--brand);opacity:.75}
.fchip button:hover{background:rgba(162,111,31,.14);opacity:1}

/* ── tables ───────────────────────────────────────────────────── */
.tbl-wrap{overflow:auto;max-height:min(70vh,820px);border-radius:0 0 var(--r-lg) var(--r-lg)}
.tbl-wrap.plain{border-radius:var(--r-lg)}
table.tbl{width:100%;min-width:640px;font-size:13.5px}
.tbl thead th{
  position:sticky;top:0;z-index:2;background:var(--surface-2);
  text-align:left;font-size:11.5px;font-weight:600;letter-spacing:.045em;text-transform:uppercase;color:var(--ink-4);
  padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap;
}
.tbl thead th.num,.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl thead th.sortable{cursor:pointer;user-select:none;transition:color .14s,background .14s}
.tbl thead th.sortable:hover{color:var(--ink-2);background:var(--surface-3)}
.tbl thead th .th-in{display:inline-flex;align-items:center;gap:4px}
.tbl thead th.num .th-in{flex-direction:row-reverse}
.tbl thead th .sort-ico{color:var(--ink-4);opacity:0;transition:opacity .14s}
.tbl thead th.sortable:hover .sort-ico{opacity:.55}
.tbl thead th.sorted{color:var(--brand)}
.tbl thead th.sorted .sort-ico{opacity:1;color:var(--brand)}
.tbl tbody td{padding:12px 16px;border-bottom:1px solid var(--line-2);vertical-align:middle;color:var(--ink-2)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr.clickable{cursor:pointer;transition:background .12s}
.tbl tbody tr.clickable:hover{background:var(--brand-tint)}
.tbl tbody tr.clickable:focus-visible{outline:2px solid var(--brand);outline-offset:-2px;background:var(--brand-tint)}
.tbl tbody tr.clickable:hover .row-go{opacity:1;transform:none}
.row-go{display:inline-grid;place-items:center;color:var(--brand);opacity:0;transform:translateX(-3px);transition:.16s var(--ease)}
.tbl .t-strong{color:var(--ink);font-weight:600}
.tbl .t-mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";letter-spacing:-.01em}
.tbl .t-muted{color:var(--ink-4)}
.tbl .amt{font-weight:650;color:var(--ink);font-variant-numeric:tabular-nums}

.cell-person{display:flex;align-items:center;gap:10px;min-width:0}
.cell-person .cp-txt{min-width:0;display:flex;flex-direction:column}
.cell-person .cp-name{font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell-person .cp-id{font-size:11.5px;color:var(--ink-4);font-variant-numeric:tabular-nums}
.cust-link{font-weight:600;color:var(--ink);border-radius:5px;transition:color .14s}
.cust-link:hover{color:var(--brand);text-decoration:underline;text-underline-offset:2px}

.inst{display:inline-block;width:86px;text-align:right;vertical-align:middle}
.inst-txt{font-weight:600;color:var(--ink);font-size:13px;font-variant-numeric:tabular-nums}
.inst-txt em{font-style:normal;color:var(--ink-4);font-weight:500}
.bar{height:3px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:5px}
.bar>i{display:block;height:100%;border-radius:3px;background:var(--brand-2);transition:width .5s var(--ease)}
.bar.done>i{background:var(--pos)}
.bar.stalled>i{background:var(--ink-4)}
.bar.lg{height:8px;border-radius:8px}

.txn{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* pagination */
.pager{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.pager-info{font-size:12.5px;color:var(--ink-4)}
.pager-info b{color:var(--ink-2);font-weight:600}
.pager-btns{margin-left:auto;display:flex;align-items:center;gap:4px}
.pg{min-width:29px;height:29px;padding:0 7px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--ink-3);display:grid;place-items:center;transition:background .14s,color .14s}
.pg:hover:not(:disabled){background:var(--surface-3);color:var(--ink)}
.pg.cur{background:var(--brand-tint);color:var(--brand-deep)}
.pg:disabled{opacity:.35;cursor:not-allowed}
.pg-gap{color:var(--ink-4);padding:0 2px;font-size:12.5px}

/* ── empty state ──────────────────────────────────────────────── */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:52px 24px;gap:4px}
.empty-ill{margin-bottom:12px;opacity:.95}
.empty h4{font-size:14.5px;font-weight:650;color:var(--ink)}
.empty p{font-size:13px;color:var(--ink-4);max-width:330px}
.empty .btn{margin-top:12px}

/* ── detail page ──────────────────────────────────────────────── */
.detail-head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.detail-id{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-3);margin-top:5px;font-variant-numeric:tabular-nums}
.detail-id .copy{display:grid;place-items:center;width:20px;height:20px;border-radius:5px;color:var(--ink-4)}
.detail-id .copy:hover{background:var(--surface-3);color:var(--ink-2)}
.detail-meta{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}

.dl{display:grid;grid-template-columns:auto 1fr;gap:11px 18px;align-items:baseline}
.dl dt{font-size:12.5px;color:var(--ink-4);white-space:nowrap}
.dl dd{margin:0;font-size:13.5px;font-weight:550;color:var(--ink);text-align:right;min-width:0;overflow-wrap:anywhere}
.dl dd .sub{display:block;font-size:11.5px;color:var(--ink-4);font-weight:450;margin-top:1px}

.kv-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2)}
.kv-row:last-child{border-bottom:0}
.kv-ico{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--surface-3);color:var(--ink-3);flex:none}
.kv-txt{min-width:0;display:flex;flex-direction:column}
.kv-label{font-size:11.5px;color:var(--ink-4)}
.kv-val{font-size:13.5px;font-weight:600;color:var(--ink);overflow-wrap:anywhere}

.progress-card{background:linear-gradient(160deg,#FCF8EF,#FBF5E8 62%,#F8F1E2);border:1px solid var(--brand-tint-2)}
.prog-top{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.prog-num{font-size:32px;font-weight:700;letter-spacing:-.04em;line-height:1;color:var(--brand-deep)}
.prog-num em{font-style:normal;font-size:20px;color:var(--brand);opacity:.7}
.prog-cap{font-size:12.5px;color:var(--brand-deep);opacity:.78;font-weight:550;padding-bottom:3px}
.prog-pct{margin-left:auto;font-size:13px;font-weight:700;color:var(--brand-deep);padding-bottom:3px}
.prog-legend{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap}
.pl{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-3)}
.pl i{width:8px;height:8px;border-radius:3px;flex:none}
.pl b{color:var(--ink);font-weight:650}

.money-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line-2);border-radius:var(--r-md);overflow:hidden;border:1px solid var(--line)}
.money-cell{background:var(--surface);padding:14px 16px}
.money-label{font-size:11.5px;color:var(--ink-4);display:flex;align-items:center;gap:6px;margin-bottom:6px}
.money-val{font-size:20px;font-weight:700;letter-spacing:-.03em;color:var(--ink)}
.money-val.pos{color:var(--pos)}
.money-val.warn{color:var(--warn)}
.money-sub{font-size:11.5px;color:var(--ink-4);margin-top:3px}

.note{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r-md);background:var(--info-bg);border:1px solid var(--info-line);font-size:12.5px;color:#22408F;line-height:1.5}
.note svg{flex:none;color:var(--info);margin-top:1px}
.note.warn{background:var(--warn-bg);border-color:var(--warn-line);color:#7A4F08}
.note.warn svg{color:var(--warn)}
.note.plain{background:var(--surface-3);border-color:var(--line);color:var(--ink-2)}
.note.plain svg{color:var(--ink-4)}
.note b{font-weight:650}

/* scheme cards on detail */
.scheme-hero{display:flex;align-items:center;gap:14px}
.scheme-mark{
  display:grid;place-items:center;width:52px;height:52px;border-radius:15px;flex:none;
  background:linear-gradient(145deg,#FBF3E1,#F1E0B8);color:var(--brand-deep);
  box-shadow:inset 0 0 0 1px rgba(162,111,31,.16);
}
.scheme-mark.v2{background:linear-gradient(145deg,#EAF3FF,#D5E4FB);color:#2B4C93;box-shadow:inset 0 0 0 1px rgba(45,80,150,.14)}
.scheme-mark.v3{background:linear-gradient(145deg,#EAF7F1,#D2EDE0);color:#0B6B45;box-shadow:inset 0 0 0 1px rgba(11,107,69,.14)}
.scheme-mark.v4{background:linear-gradient(145deg,#F5EEFB,#E7DBF5);color:#5B3A8E;box-shadow:inset 0 0 0 1px rgba(91,58,142,.14)}

/* ── users & access ───────────────────────────────────────────── */
.owner-card{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.owner-card .oc-main{min-width:0;flex:1}
.owner-name{font-size:17px;font-weight:700;letter-spacing:-.022em}
.owner-mail{font-size:13px;color:var(--ink-3);margin-top:2px}
.owner-tags{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}

.access-list{display:flex;flex-direction:column;gap:6px}
.access-item{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)}
.access-item svg{flex:none;color:var(--pos)}
.access-item.no svg{color:var(--ink-4)}
.access-item.no{color:var(--ink-4)}

/* ── modal ────────────────────────────────────────────────────── */
.modal-root{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:20px}
.modal-back{position:absolute;inset:0;background:rgba(17,24,39,.42);backdrop-filter:blur(3px);animation:fadeIn .18s var(--ease) both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  position:relative;width:100%;max-width:440px;background:var(--surface);border-radius:var(--r-xl);
  box-shadow:var(--sh-lg);animation:modalIn .22s var(--ease) both;max-height:calc(100vh - 40px);display:flex;flex-direction:column;
}
@keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.975)}to{opacity:1;transform:none}}
.modal-head{padding:18px 20px 14px;border-bottom:1px solid var(--line-2);display:flex;align-items:flex-start;gap:12px}
.modal-head h3{font-size:16px;font-weight:680;letter-spacing:-.018em}
.modal-head p{font-size:12.5px;color:var(--ink-4);margin-top:3px}
.modal-head .icon-btn{margin-left:auto;margin-top:-3px}
.modal-body{padding:18px 20px;overflow-y:auto;display:grid;gap:14px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line-2);display:flex;gap:9px;justify-content:flex-end}

/* ── dropdown menu ────────────────────────────────────────────── */
.menu{
  position:absolute;top:calc(100% + 8px);right:0;z-index:50;min-width:250px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-lg);
  padding:6px;animation:popIn .16s var(--ease) both;
}
.menu-head{padding:10px 10px 9px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line-2);margin-bottom:6px}
.menu-head .mh-txt{min-width:0;display:flex;flex-direction:column}
.menu-head .mh-name{font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-head .mh-mail{font-size:11.5px;color:var(--ink-4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-sec{padding:8px 10px 6px;font-size:10.5px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-4)}
.menu-item{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:500;color:var(--ink-2);text-align:left;transition:background .13s,color .13s}
.menu-item:hover{background:var(--surface-3);color:var(--ink)}
.menu-item svg{flex:none;color:var(--ink-4)}
.menu-item:hover svg{color:var(--ink-2)}
.menu-item.danger{color:var(--neg)}
.menu-item.danger svg{color:var(--neg)}
.menu-item.danger:hover{background:var(--neg-bg)}
.menu-sep{height:1px;background:var(--line-2);margin:6px 0}

.role-switch{display:flex;gap:4px;padding:4px;background:var(--surface-3);border-radius:10px;margin:0 6px 4px}
.role-opt{flex:1;height:30px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--ink-3);transition:.14s var(--ease)}
.role-opt:hover{color:var(--ink)}
.role-opt.on{background:var(--surface);color:var(--brand-deep);box-shadow:var(--sh-xs)}
.role-hint{font-size:11.5px;color:var(--ink-4);padding:2px 12px 8px;line-height:1.45}

/* notifications */
.notif{display:flex;gap:11px;padding:10px;border-radius:9px;transition:background .13s}
.notif:hover{background:var(--surface-3)}
.notif-ico{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;flex:none}
.notif-txt{min-width:0;font-size:12.5px;color:var(--ink-2);line-height:1.45}
.notif-txt b{color:var(--ink);font-weight:620}
.notif-time{display:block;font-size:11px;color:var(--ink-4);margin-top:3px}

/* ── tooltip ──────────────────────────────────────────────────── */
[data-tip]{position:relative}
[data-tip]::after{
  content:attr(data-tip);position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%) translateY(3px);
  background:#22262E;color:#fff;font-size:11.5px;font-weight:550;line-height:1.3;padding:5px 8px;border-radius:6px;
  white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .16s var(--ease),transform .16s var(--ease);
  z-index:80;box-shadow:0 4px 12px rgba(17,24,39,.2);
}
[data-tip]:hover::after,[data-tip]:focus-visible::after{opacity:1;transform:translateX(-50%)}
[data-tip-below]::after{bottom:auto;top:calc(100% + 7px);transform:translateX(-50%) translateY(-3px)}
[data-tip-below]:hover::after{transform:translateX(-50%)}
/* tooltips are a pointer affordance — drop them entirely on touch/narrow screens
   so the nowrap bubble can never widen the page */
@media (max-width:820px),(hover:none){ [data-tip]::after{content:none} }

/* ── info icon (plain-language explainer on stat/KPI tiles) ─────── */
.info-ico{
  display:inline-flex;align-items:center;justify-content:center;color:var(--ink-4);
  cursor:help;flex:none;border-radius:50%;transition:color .14s;
}
.info-ico:hover,.info-ico:focus-visible{color:var(--brand)}
.kpi-label{display:inline-flex;align-items:center;gap:5px}
.stat-label{display:inline-flex;align-items:center;gap:5px}

/* ── toasts ───────────────────────────────────────────────────── */
.toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:9px;align-items:center;pointer-events:none}
.toast{
  display:flex;align-items:center;gap:10px;padding:10px 15px;border-radius:11px;
  background:#22262E;color:#fff;font-size:13px;font-weight:550;box-shadow:var(--sh-lg);
  animation:toastIn .26s var(--ease) both;max-width:min(92vw,460px);
}
.toast svg{flex:none;color:#6EDBA6}
.toast.warn svg{color:#F3C258}
.toast.out{animation:toastOut .22s var(--ease) both}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px) scale(.97)}}

/* ── skeleton ─────────────────────────────────────────────────── */
.sk{background:linear-gradient(90deg,#EDEFF3 25%,#F5F6F9 37%,#EDEFF3 63%);background-size:400% 100%;animation:shimmer 1.25s ease-in-out infinite;border-radius:6px}
@keyframes shimmer{0%{background-position:100% 50%}100%{background-position:0 50%}}
.sk-line{height:11px;margin:7px 0}
.sk-row{display:flex;gap:16px;padding:13px 16px;border-bottom:1px solid var(--line-2)}
.sk-row>.sk{height:12px}

/* ── responsive ───────────────────────────────────────────────── */
.only-mobile{display:none}
@media (max-width:1180px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .split{grid-template-columns:1fr}
  .grid-3{grid-template-columns:1fr 1fr}
}
@media (max-width:1040px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .26s var(--ease);box-shadow:var(--sh-lg)}
  .app.nav-open .sidebar{transform:none}
  .only-mobile{display:grid}
  .view{padding:20px 16px 56px}
  .topbar{padding:0 14px}
  .grid-2{grid-template-columns:1fr}
  .biz{display:none}
}
@media (max-width:760px){
  .stats,.stats.three{grid-template-columns:1fr}
  .grid-3{grid-template-columns:1fr}
  .money-grid{grid-template-columns:1fr}
  .page-head-actions{width:100%}
  .search input{width:100%}
  .search{flex:1}
  .crumbs{font-size:12.5px}
  .page-title{font-size:22px}
  .pop{position:fixed;left:12px;right:12px;top:auto;min-width:0;width:auto}
}
@media print{.sidebar,.topbar,.page-head-actions,.pager{display:none}.view{padding:0}}

/* ══════════════════════════════════════════════════════════════════
   DATA VISUALISATION
   Categorical slots are a fixed, CVD-validated order — never cycled.
   Status hues are reserved for Paid / Pending / Failed and always
   ship with a text label beside the swatch.
   ══════════════════════════════════════════════════════════════════ */
:root{
  --viz-1:#2A78D6;   /* slot 1 — blue   */
  --viz-2:#EB6834;   /* slot 2 — orange */
  --viz-3:#1BAF7A;   /* slot 3 — aqua   */
  --viz-4:#4A3AA7;   /* slot 4 — violet */
  --viz-good:#0CA30C; --viz-warn:#FAB219; --viz-crit:#D03B3B;
  --viz-grid:#ECEEF3; --viz-axis:#D7DBE3; --viz-label:#9BA2B0;
  --viz-brand:#A26F1F;
}
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-xs);display:flex;flex-direction:column;min-width:0}
.chart-head{display:flex;align-items:flex-start;gap:12px;padding:16px 18px 10px;flex-wrap:wrap}
.chart-head h3{font-size:14.5px;font-weight:650;letter-spacing:-.012em}
.chart-head p{font-size:12px;color:var(--ink-4);margin-top:2px}
.chart-head .spacer{margin-left:auto}
.chart-body{padding:2px 12px 14px;min-width:0}
.chart-body.pad{padding:2px 18px 16px}
.chart-foot{padding:0 18px 16px}
/* wraps a chart whose inner div is pinned to a minimum pixel width (e.g.
   the per-scheme Collections chart at day/week granularity) — scrolls
   horizontally only once that minimum no longer fits the card. The outer
   .chart-scroll-wrap stays put (doesn't scroll) so its ::after fade sits
   fixed at the card's right edge instead of sliding away with the content. */
.chart-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.chart-scroll::-webkit-scrollbar{height:7px}
.chart-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.chart-scroll-wrap{position:relative}
.chart-scroll-wrap.has-scroll::after{content:"";position:absolute;top:0;right:0;bottom:26px;width:32px;background:linear-gradient(to right, transparent, var(--surface));pointer-events:none}
.chart-scroll-hint{display:inline-flex;align-items:center;gap:3px;color:var(--ink-4);font-weight:500}
.chart-scroll-hint svg{opacity:.7}
.viz{display:block;width:100%;overflow:visible}
.viz .grid-line{stroke:var(--viz-grid);stroke-width:1;shape-rendering:crispEdges}
.viz .axis-line{stroke:var(--viz-axis);stroke-width:1;shape-rendering:crispEdges}
.viz .tick{fill:var(--viz-label);font-size:10.5px;font-weight:500;font-variant-numeric:tabular-nums}
.viz .tick.mid{fill:var(--ink-3)}
.viz .mark{transition:opacity .14s var(--ease)}
.viz .hit{fill:transparent;cursor:crosshair}
.viz .bar-hit{fill:transparent;cursor:pointer}
.viz .crosshair{stroke:var(--viz-axis);stroke-width:1;opacity:0}
.viz .focus-dot{opacity:0}
.viz .dlabel{fill:var(--ink-2);font-size:11px;font-weight:650;font-variant-numeric:tabular-nums}
.viz .dlabel.mut{fill:var(--ink-4);font-weight:500}
.viz .arc{cursor:pointer;transition:opacity .14s var(--ease)}
.viz.dim-others .arc:not(.on),.viz.dim-others .mark:not(.on){opacity:.32}
.viz .center-val{fill:var(--ink);font-size:21px;font-weight:700;letter-spacing:-.03em}
.viz .center-lab{fill:var(--ink-4);font-size:10.5px;font-weight:600;letter-spacing:.05em}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 18px 0}
.legend.stack{flex-direction:column;gap:8px;padding-top:4px}
.lg-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);min-width:0;background:none;text-align:left}
.lg-item i{width:9px;height:9px;border-radius:3px;flex:none}
.lg-item .lg-name{color:var(--ink-2);font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-item .lg-val{margin-left:auto;color:var(--ink);font-weight:650;font-variant-numeric:tabular-nums;padding-left:10px;white-space:nowrap;flex:none}
.lg-item .lg-sub{color:var(--ink-4);font-variant-numeric:tabular-nums}
.legend.stack .lg-item{width:100%}
button.lg-item{cursor:pointer;border-radius:7px;padding:3px 6px;margin:-3px -6px;transition:background .13s}
button.lg-item:hover{background:var(--surface-3)}

#chartTip{
  position:fixed;z-index:95;pointer-events:none;opacity:0;transform:translateY(3px);
  background:#22262E;color:#fff;border-radius:9px;padding:9px 11px;font-size:12px;line-height:1.45;
  box-shadow:0 8px 24px rgba(17,24,39,.26);transition:opacity .12s var(--ease),transform .12s var(--ease);
  max-width:260px;font-variant-numeric:tabular-nums;
}
#chartTip.on{opacity:1;transform:none}
#chartTip .tt-title{font-weight:650;font-size:12.5px;margin-bottom:5px;color:#fff}
#chartTip .tt-row{display:flex;align-items:center;gap:8px;white-space:nowrap}
#chartTip .tt-row i{width:8px;height:8px;border-radius:2.5px;flex:none}
#chartTip .tt-row .k{color:#B9BEC9}
#chartTip .tt-row .v{margin-left:auto;font-weight:650;padding-left:14px}
#chartTip .tt-note{color:#9AA1AE;font-size:11px;margin-top:4px}

/* info-icon tooltip — fixed-position, JS-placed so it can never be clipped
   by an ancestor's overflow:hidden (unlike the CSS ::after bubbles above) */
#infoTip{
  position:fixed;z-index:96;pointer-events:none;opacity:0;transform:translateY(3px);
  background:#22262E;color:#fff;border-radius:9px;padding:8px 11px;
  font-size:11.5px;line-height:1.44;font-weight:500;text-align:left;
  box-shadow:0 8px 24px rgba(17,24,39,.26);transition:opacity .12s var(--ease),transform .12s var(--ease);
  width:214px;max-width:min(214px,64vw);
}
#infoTip.on{opacity:1;transform:none}

/* KPI cards with sparkline */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:15px 16px 34px;
     box-shadow:var(--sh-xs);overflow:hidden;transition:box-shadow .18s var(--ease),transform .18s var(--ease)}
.kpi:hover{box-shadow:var(--sh-sm);transform:translateY(-1px)}
.kpi-top{display:flex;align-items:flex-start;gap:9px;margin-bottom:10px}
.kpi-label{font-size:12.5px;font-weight:550;color:var(--ink-2);letter-spacing:-.004em;line-height:1.35}
.kpi-top .stat-ico{margin-left:auto}
.kpi-val{font-size:26px;font-weight:700;letter-spacing:-.035em;line-height:1.12;color:var(--ink)}
.kpi-meta{display:flex;align-items:center;gap:7px;margin-top:7px;flex-wrap:wrap}
.kpi-note{font-size:11.5px;color:var(--ink-4)}
.kpi-note b{color:var(--ink-2);font-weight:600}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}
.delta.up{color:#06713F}.delta.down{color:#B42318}.delta.flat{color:var(--ink-4)}
.kpi-spark{position:absolute;left:0;right:0;bottom:0;width:100%;height:34px;opacity:.75;pointer-events:none}
/* the "New Enrolments" tile's own inline period picker */
.kpi-enroll{padding-bottom:16px}
.kpi-enroll-ctl{margin-top:12px}
.kpi-sel{
  height:30px;width:100%;padding:0 28px 0 10px;border-radius:8px;border:1px solid var(--line-strong);
  background:var(--surface);font-size:12px;font-weight:550;cursor:pointer;appearance:none;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%239BA2B0' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 8px center;
}
.kpi-sel:focus{outline:none;border-color:var(--brand);box-shadow:var(--ring)}
.kpi-enroll-dates{display:flex;align-items:center;gap:6px;margin-top:8px}
.kpi-enroll-dates input.inp{height:30px;font-size:12px;padding:0 8px;flex:1;min-width:0}
.kpi-enroll-dates span{color:var(--ink-4);font-size:11px}

/* analytics toolbar */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.seg{display:flex;gap:2px;padding:3px;background:var(--surface-3);border:1px solid var(--line);border-radius:10px}
.seg button{height:28px;padding:0 12px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--ink-3);transition:.14s var(--ease);white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-xs)}
.seg.sm button{height:24px;padding:0 9px;font-size:11.5px}
.tb-select{position:relative}
.tb-select select{
  height:36px;min-width:150px;padding:0 30px 0 12px;border-radius:10px;border:1px solid var(--line-strong);
  background:var(--surface);font-size:13px;font-weight:550;cursor:pointer;appearance:none;box-shadow:var(--sh-xs);
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%239BA2B0' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center;
}
.tb-select select:focus{outline:none;border-color:var(--brand);box-shadow:var(--ring)}
.tb-range{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-4)}
.tb-range svg{color:var(--ink-4)}
.tb-range b{color:var(--ink-2);font-weight:600}
.tb-custom{display:flex;align-items:center;gap:7px}
.tb-custom input.inp{width:148px}
.tb-custom span{color:var(--ink-4);font-size:12px}
@media (max-width:760px){.tb-custom{width:100%}.tb-custom input.inp{width:0;flex:1}}

/* 12-column chart grid */
.grid12{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;margin-top:20px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}
.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(2,1fr)}
  .c8,.c7,.c6,.c5,.c4{grid-column:span 12}}
@media (max-width:760px){.kpis{grid-template-columns:1fr}.toolbar{gap:8px}.tb-range{display:none}
  .seg button{padding:0 9px;font-size:12px}.tb-select,.tb-select select{min-width:0;width:100%}
  /* keep the range pills reachable instead of clipping the last one */
  .toolbar>.seg{width:100%;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .toolbar>.seg::-webkit-scrollbar{display:none}
  .toolbar>.seg button{flex:0 0 auto}}

/* insight strip */
.strip{display:flex;align-items:center;gap:0;background:var(--surface);border:1px solid var(--line);
       border-radius:var(--r-lg);box-shadow:var(--sh-xs);overflow:hidden;margin-bottom:16px;flex-wrap:wrap}
.strip-cell{flex:1;min-width:160px;padding:13px 18px;border-right:1px solid var(--line-2)}
.strip-cell:last-child{border-right:0}
.strip-lab{font-size:11.5px;color:var(--ink-4);display:flex;align-items:center;gap:6px;margin-bottom:4px}
.strip-val{font-size:19px;font-weight:700;letter-spacing:-.03em;color:var(--ink)}
.strip-val.pos{color:var(--pos)}.strip-val.warn{color:var(--warn)}.strip-val.neg{color:var(--neg)}
.strip-bar{flex:2;min-width:230px;padding:13px 18px}

.mini-stack{display:flex;height:9px;border-radius:6px;overflow:hidden;gap:2px;background:var(--surface)}
.mini-stack>i{display:block;height:100%;border-radius:2px;transition:flex .4s var(--ease)}

/* ── scheme-progress bar (Overview → "Scheme progress", each scheme's
   own "Member progress") — namespaced "spbar-" so it never collides
   with the unrelated .prog-* classes the customer-detail instalment
   widget already uses.
   One flush 100%-stacked bar — segments sit edge-to-edge with only a
   hairline divider between them, rounded solely at the bar's own two
   ends (via overflow:hidden on the track), plus a matching legend so
   every segment reads as count + share without crowding. */
.spbar-track{display:flex;height:34px;border-radius:10px;overflow:hidden;background:var(--surface-3)}
.spbar-track>i{display:block;height:100%;position:relative}
.spbar-track>i+i{box-shadow:inset 1.5px 0 0 rgba(255,255,255,.5)}
.spbar-legend{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;margin-top:16px}
.spbar-cell{display:flex;flex-direction:column;gap:5px;padding-left:14px;position:relative}
.spbar-cell::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:4px;border-radius:3px;background:var(--dot)}
.spbar-name{font-size:12px;font-weight:650;color:var(--ink-2)}
.spbar-val{font-size:15px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.spbar-val span{font-size:12px;font-weight:600;color:var(--ink-4);margin-left:4px}
@media (max-width:900px){ .spbar-legend{grid-template-columns:repeat(2,minmax(0,1fr))} }

/* compact variant (used where the card is narrower, e.g. a scheme's
   own "Member progress" card) — a vertical list instead of a grid */
.spbar-rows{display:flex;flex-direction:column;gap:9px;margin-top:15px}
.spbar-row{display:flex;align-items:center;gap:8px;font-size:12.5px}
.spbar-row>i{width:9px;height:9px;border-radius:3px;flex:none}
.spbar-row-name{flex:1;color:var(--ink-2);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spbar-row-val{color:var(--ink-4);font-variant-numeric:tabular-nums;flex:none}
.spbar-row-val b{color:var(--ink);font-weight:650;margin-left:3px}

/* ══════════════════════════════════════════════════════════════════
   SETTINGS
   ══════════════════════════════════════════════════════════════════ */
.set-wrap{display:grid;grid-template-columns:212px minmax(0,1fr);gap:24px;align-items:start}
.set-nav{position:sticky;top:calc(var(--topbar-h) + 22px);display:flex;flex-direction:column;gap:2px}
.set-nav button{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:9px;font-size:13px;
  font-weight:550;color:var(--ink-3);text-align:left;transition:background .14s,color .14s}
.set-nav button svg{color:var(--ink-4);flex:none}
.set-nav button:hover{background:var(--surface-3);color:var(--ink)}
.set-nav button.on{background:var(--brand-tint);color:var(--brand-deep);font-weight:650}
.set-nav button.on svg{color:var(--brand)}
.set-sections{display:grid;gap:18px;min-width:0}
.set-row{display:flex;align-items:center;gap:18px;padding:14px 18px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.set-row:last-child{border-bottom:0}
.set-txt{flex:1;min-width:190px}
.set-title{font-size:13.5px;font-weight:600;color:var(--ink)}
.set-desc{font-size:12px;color:var(--ink-4);margin-top:2px;line-height:1.45}
.set-ctl{flex:none;display:flex;align-items:center;gap:8px}
.set-ctl select.inp{min-width:170px}

.switch{position:relative;width:42px;height:24px;border-radius:20px;background:var(--line-strong);
  transition:background .2s var(--ease);flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(17,24,39,.22);transition:transform .2s var(--ease)}
.switch.on{background:var(--brand)}
.switch.on::after{transform:translateX(18px)}
.switch:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--line-2)}
.set-cell{background:var(--surface);padding:14px 18px}
.set-cell .set-k{font-size:11.5px;color:var(--ink-4);display:flex;align-items:center;gap:6px;margin-bottom:5px}
.set-cell .set-v{font-size:14px;font-weight:600;color:var(--ink);overflow-wrap:anywhere}

.session{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line-2)}
.session:last-child{border-bottom:0}
.session .s-ico{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--surface-3);color:var(--ink-3);flex:none}
.session .s-txt{flex:1;min-width:0}
.session .s-name{font-size:13px;font-weight:600;color:var(--ink)}
.session .s-meta{font-size:11.5px;color:var(--ink-4)}

@media (max-width:980px){.set-wrap{grid-template-columns:1fr}
  .set-nav{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px;gap:6px}
  .set-nav button{white-space:nowrap}}

/* compact density (Settings → Appearance) */
body.compact .tbl tbody td{padding:7.5px 14px}
body.compact .tbl thead th{padding:8px 14px}
body.compact .view{padding-top:20px}
body.compact .card-head{padding:12px 16px}
body.compact .kpi{padding:12px 14px 28px}
body.compact .kpi-val{font-size:23px}
body.compact .stat{padding:13px 15px 12px}
body.compact .grid12{gap:12px}
body.compact .kpis{gap:11px}
</style>

function mulberry32(a){ return function(){

    var ct = parseISO(customTo !== undefined ? customTo : state.an.customTo);
    to = ct ? dayStart(ct) : to;

    if (from > to){ var tmp = from; from = to; to = tmp; }
    span = Math.max(1, Math.round((to - from) / 86400000) + 1);

/* split a range into ~N readable buckets: days, weeks or months */
function makeBuckets(b){
  var out = [], i, cur;
  if (b.days <= 1){
    return { kind:"day", edges:[b.from], next:[addDays(b.from,1)], labels:[fmtDateShort(b.from)] };
  }
  if (b.days <= 14){
    for (i = 0; i < b.days; i++){ cur = addDays(b.from, i); out.push([cur, addDays(cur,1), fmtDateShort(cur)]); }
  } else if (b.days <= 100){
    var step = Math.ceil(b.days / 12);
    for (i = 0; i < b.days; i += step){
      cur = addDays(b.from, i);
      out.push([cur, addDays(cur, step), fmtDateShort(cur)]);
    }
  } else {
    cur = new Date(b.from.getFullYear(), b.from.getMonth(), 1);
    var end = new Date(b.to.getFullYear(), b.to.getMonth(), 1);
    while (cur <= end){ out.push([cur, addMonths(cur,1), fmtMonth(cur)]); cur = addMonths(cur,1); }
    if (out.length > 18){ out = out.slice(out.length - 18); }
  }

           edges: out.map(function(x){ return x[0]; }),

  }
  return { amount:sum, count:n };
}

  for (var i = 0; i < cust.length; i++) if (cust[i].startDate >= from && cust[i].startDate <= to) n++;

function seriesCollections(pays, b){

      cnt = bk.edges.map(function(){ return 0; });

    var p = pays[i];
    if (p.status !== "Paid" || p.paymentDate < b.from || p.paymentDate > b.to) continue;
    for (var j = bk.edges.length - 1; j >= 0; j--){
      if (p.paymentDate >= bk.edges[j]){ vals[j] += p.amount; cnt[j]++; break; }
    }

   lets the jeweller switch granularity for that one scheme */

  var out = [], cur;

    for (cur = dayStart(from); cur <= to; cur = addDays(cur, 1)) out.push([cur, addDays(cur, 1), fmtDateShort(cur)]);
  } else if (unit === "week"){
    for (cur = dayStart(from); cur <= to; cur = addDays(cur, 7)) out.push([cur, addDays(cur, 7), fmtDateShort(cur)]);

    var end = new Date(to.getFullYear(), to.getMonth(), 1);
    while (cur <= end){ out.push([cur, addMonths(cur, 1), fmtMonth(cur)]); cur = addMonths(cur, 1); }
  }
  if (!out.length) out.push([dayStart(from), addDays(dayStart(from), 1), fmtDateShort(from)]);

  for (var i = 0; i < pays.length; i++){
    var p = pays[i];
    if (p.status !== "Paid" || !p.paymentDate || p.paymentDate < from || p.paymentDate > to) continue;
    for (var j = bk.edges.length - 1; j >= 0; j--){
      if (p.paymentDate >= bk.edges[j]){ vals[j] += p.amount; cnt[j]++; break; }
    }

    if (c.startDate < b.from || c.startDate > b.to) continue;
    for (var j = bk.edges.length - 1; j >= 0; j--){

function mixByScheme(cust, pays){
  var out = SCHEMES.map(function(s){
    return { id:s.id, name:s.name, color:SCHEME_HEX[s.id], value:0, amount:0, active:0 };
  });
  var byId = {}; out.forEach(function(o){ byId[o.id] = o; });
  cust.forEach(function(c){ if (byId[c.schemeId]){ byId[c.schemeId].value++; if (c.status === "Active") byId[c.schemeId].active++; } });
  pays.forEach(function(p){ if (p.status === "Paid" && byId[p.schemeId]) byId[p.schemeId].amount += p.amount; });
  return out.filter(function(o){ return o.value > 0; });
}
function mixByStatus(pays){
  var m = { Paid:0, Pending:0, Failed:0 }, amt = { Paid:0, Pending:0, Failed:0 };
  pays.forEach(function(p){ m[p.status]++; amt[p.status] += p.amount; });
  return ["Paid","Pending","Failed"].map(function(k){
    return { id:k, name:k, color:STATUS_HEX[k], value:m[k], amount:amt[k] };
  }).filter(function(o){ return o.value > 0; });
}
/* how far through their scheme customers are — ordered bands, so an
   ordinal ramp of ONE hue is the right encoding here, not categorical */
function progressBands(cust){
  var bands = [
    { name:"0–25%",   lo:0,   hi:25,    n:0, tone:"#86B6EF" },
    { name:"26–50%",  lo:25,  hi:50,    n:0, tone:"#5598E7" },
    { name:"51–75%",  lo:50,  hi:75,    n:0, tone:"#2A78D6" },
    { name:"76–99%",  lo:75,  hi:99.99, n:0, tone:"#1C5CAB" },
    { name:"Complete",lo:99.99, hi:101, n:0, tone:"#104281" }
  ];
  cust.forEach(function(c){
    var p = (c.installmentsPaid / c.totalInstallments) * 100;
    for (var i = 0; i < bands.length; i++){
      if (p <= bands[i].hi || i === bands.length - 1){ bands[i].n++; break; }
    }
  });
  return bands;
}
/* instalments falling due in the next N months — the collection forecast */
function upcomingDues(pays, months){
  var out = [], cur = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1), i, j;
  for (i = 0; i < months; i++){ out.push({ label:fmtMonth(addMonths(cur,i)), from:addMonths(cur,i), to:addMonths(cur,i+1), amount:0, count:0 }); }
  for (i = 0; i < pays.length; i++){
    var p = pays[i];
    if (p.status === "Paid") continue;
    for (j = 0; j < out.length; j++){
      if (p.dueDate >= out[j].from && p.dueDate < out[j].to){ out[j].amount += p.amount; out[j].count++; break; }
    }
  }
  return out;
}

/* ══════════════════════════════════════════════════════════════════
   8c · CHART TOOLKIT  —  vanilla inline SVG, no libraries
   Every chart returns an HTML string so it drops straight into the
   view templates. Hover behaviour is delegated off data-* attributes,
   so charts survive re-renders without re-binding.

   Encoding rules held throughout:
     · categorical hue order is fixed per entity, never cycled or
       reassigned by rank, so filtering never repaints the survivors
     · status hues (Paid / Pending / Failed) are reserved and always
       ship beside a text label, never colour alone
     · one y-axis per plot — never a second scale
     · hairline solid gridlines, thin marks, 4px rounded data-ends
     · a 2px surface gap separates adjacent/stacked fills
   ══════════════════════════════════════════════════════════════════ */
var _vizId = 0;
function vizId(){ return "v" + (++_vizId); }

/* pack a tooltip payload onto a mark; the delegated handler reads it back */
function tipAttr(title, rows, note){
  var d = { t:title, r:rows || [], n:note || "" };
  return ' data-tip-json="' + h(JSON.stringify(d)) + '"';
}
/* Pick the TICK INTERVAL first, then the axis top — so gridlines land on
   round numbers (0 · 1.5L · 3L · 4.5L · 6L) instead of 0 · 1.3L · 2.5L · 3.8L. */
function niceScale(maxVal, count){
  if (!(maxVal > 0)) return { max:1, ticks:[0, 1] };
  var raw = maxVal / count;
  var mag = Math.pow(10, Math.floor(Math.log10(raw)));
  var n = raw / mag;
  var mult = n <= 1 ? 1 : n <= 1.5 ? 1.5 : n <= 2 ? 2 : n <= 2.5 ? 2.5
           : n <= 3 ? 3 : n <= 4 ? 4 : n <= 5 ? 5 : n <= 6 ? 6 : n <= 8 ? 8 : 10;
  var step = mult * mag, top = step * count, guard = 0;
  while (top < maxVal && guard++ < 40) top += step;
  var ticks = [];
  for (var i = 0; i * step <= top + step * 1e-6; i++) ticks.push(i * step);
  return { max: top, ticks: ticks };
}
/* Catmull-Rom → cubic Bézier, so trends read as a smooth curve
   without the overshoot a naive spline gives on spiky data */
function smoothPath(pts, tension){
  if (pts.length < 2) return pts.length ? "M" + pts[0][0] + "," + pts[0][1] : "";
  var t = tension == null ? 0.42 : tension, d = "M" + pts[0][0] + "," + pts[0][1];
  for (var i = 0; i < pts.length - 1; i++){
    var p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    var c1x = p1[0] + (p2[0] - p0[0]) / 6 * t, c1y = p1[1] + (p2[1] - p0[1]) / 6 * t;
    var c2x = p2[0] - (p3[0] - p1[0]) / 6 * t, c2y = p2[1] - (p3[1] - p1[1]) / 6 * t;
    d += "C" + c1x.toFixed(1) + "," + c1y.toFixed(1) + " " + c2x.toFixed(1) + "," + c2y.toFixed(1)
       + " " + p2[0].toFixed(1) + "," + p2[1].toFixed(1);
  }
  return d;
}
function roundedTopRect(x, y, w, hgt, r){
  r = Math.min(r, w / 2, hgt);
  if (hgt <= 0.6) return "";
  return "M" + x + "," + (y + hgt) + "V" + (y + r)
       + "a" + r + "," + r + " 0 0 1 " + r + ",-" + r
       + "h" + (w - 2 * r)
       + "a" + r + "," + r + " 0 0 1 " + r + "," + r
       + "V" + (y + hgt) + "Z";
}
function roundedRightRect(x, y, w, hgt, r){
  r = Math.min(r, hgt / 2, w);
  if (w <= 0.6) return "";
  return "M" + x + "," + y + "h" + (w - r)
       + "a" + r + "," + r + " 0 0 1 " + r + "," + r
       + "v" + (hgt - 2 * r)
       + "a" + r + "," + r + " 0 0 1 " + (-r) + "," + r
       + "H" + x + "Z";
}

/* ── 1 · sparkline ─────────────────────────────────────────────────
   No axes, no legend — it rides inside a KPI card as a shape cue. */
function sparkline(values, color, w, hgt){
  if (!SETTINGS.sparklines || !values || values.length < 2) return "";
  w = w || 112; hgt = hgt || 40;
  var id = vizId(), max = Math.max.apply(null, values), min = Math.min.apply(null, values);
  var span = (max - min) || 1, pad = 4;
  var pts = values.map(function(v, i){
    return [ (i / (values.length - 1)) * w, hgt - pad - ((v - min) / span) * (hgt - pad * 2) ];
  });
  var line = smoothPath(pts);
  return '<svg class="kpi-spark" viewBox="0 0 ' + w + ' ' + hgt + '" preserveAspectRatio="none" aria-hidden="true">'
    + '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0%" stop-color="' + color + '" stop-opacity=".22"/>'
    + '<stop offset="100%" stop-color="' + color + '" stop-opacity="0"/></linearGradient></defs>'
    + '<path d="' + line + 'L' + w + ',' + hgt + 'L0,' + hgt + 'Z" fill="url(#' + id + ')"/>'
    + '<path d="' + line + '" fill="none" stroke="' + color + '" stroke-width="1.6" stroke-linecap="round" stroke-opacity=".8"/>'
    + '</svg>';
}

/* ── 2 · area / line chart ─────────────────────────────────────────
   One measure, one axis. Crosshair + tooltip on a full-height hit
   band per x position, so the target is far bigger than the mark. */
function areaChart(o){
  var w = o.width || 780, hgt = o.height || 250, m = { t:14, r:14, b:26, l:o.leftPad || 52 };
  var iw = w - m.l - m.r, ih = hgt - m.t - m.b;
  var vals = o.values, n = vals.length;
  if (!n) return chartEmpty(o.emptyMsg || "No data in this period");
  var id = vizId();
  var fmt = o.format || inrAxis, fmtFull = o.formatFull || o.format || inr;
  var sc = niceScale(Math.max.apply(null, vals.concat([o.minMax || 0])), 4);
  var max = sc.max, tks = sc.ticks;
  var xAt = function(i){ return n === 1 ? m.l + iw / 2 : m.l + (i / (n - 1)) * iw; };
  var yAt = function(v){ return m.t + ih - (v / max) * ih; };
  var pts = vals.map(function(v, i){ return [xAt(i), yAt(v)]; });
  var line = smoothPath(pts);
  var refLine = "";
  if (o.refValues){
    refLine = '<path d="' + smoothPath(o.refValues.map(function(v, i){ return [xAt(i), yAt(v)]; }))
            + '" fill="none" stroke="' + (o.refColor || "var(--viz-1)")
            + '" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".85"/>';
  }

  var grid = tks.map(function(t){
    var y = yAt(t);
    return '<line class="' + (t === 0 ? "axis-line" : "grid-line") + '" x1="' + m.l + '" y1="' + y.toFixed(1)
         + '" x2="' + (w - m.r) + '" y2="' + y.toFixed(1) + '"/>'
         + '<text class="tick" x="' + (m.l - 9) + '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end">' + h(fmt(t)) + '</text>';
  }).join("");

  /* label every ~Nth x tick so they never collide */
  var every = Math.max(1, Math.ceil(n / (o.maxXLabels || 8)));
  var xlab = o.labels.map(function(l, i){
    if (i % every !== 0 && i !== n - 1) return "";
    return '<text class="tick" x="' + xAt(i).toFixed(1) + '" y="' + (hgt - 7) + '" text-anchor="middle">' + h(l) + '</text>';
  }).join("");

  /* hit bands + per-point focus dot */
  var bandW = n > 1 ? iw / (n - 1) : iw;
  var hits = vals.map(function(v, i){
    var x = xAt(i);
    return '<g class="pt" data-i="' + i + '">'
      + '<line class="crosshair" x1="' + x.toFixed(1) + '" y1="' + m.t + '" x2="' + x.toFixed(1) + '" y2="' + (m.t + ih) + '"/>'
      + '<circle class="focus-dot" cx="' + x.toFixed(1) + '" cy="' + yAt(v).toFixed(1) + '" r="4.5" fill="' + o.color
      + '" stroke="#fff" stroke-width="2"/>'
      + '<rect class="hit" x="' + Math.max(m.l, x - bandW / 2).toFixed(1) + '" y="' + m.t + '" width="'
      + Math.min(bandW, iw).toFixed(1) + '" height="' + ih + '"'
      + tipAttr(o.labels[i], [[o.color, o.seriesName, fmtFull(v)]].concat(o.extraRows ? o.extraRows(i) : []), o.noteAt ? o.noteAt(i) : "")
      + '></rect></g>';
  }).join("");

  return '<svg class="viz" viewBox="0 0 ' + w + ' ' + hgt + '" role="img" aria-label="' + h(o.aria || o.seriesName) + '">'
    + '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0%" stop-color="' + o.color + '" stop-opacity=".26"/>'
    + '<stop offset="100%" stop-color="' + o.color + '" stop-opacity=".01"/></linearGradient></defs>'
    + grid
    + '<path d="' + line + 'L' + xAt(n - 1).toFixed(1) + ',' + (m.t + ih) + 'L' + xAt(0).toFixed(1) + ',' + (m.t + ih) + 'Z" fill="url(#' + id + ')"/>'
    + refLine
    + '<path d="' + line + '" fill="none" stroke="' + o.color + '" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>'
    + xlab + hits
    + '</svg>';
}

/* ── 3 · vertical bar chart ────────────────────────────────────────
   4px rounded data-end anchored to the baseline; one hue for all
   bars (length already encodes magnitude — never ramp it too). */
function barChart(o){
  var w = o.width || 780, hgt = o.height || 230, m = { t:14, r:12, b:26, l:o.leftPad || 54 };
  var iw = w - m.l - m.r, ih = hgt - m.t - m.b;
  var vals = o.values, n = vals.length;
  if (!n) return chartEmpty(o.emptyMsg || "No data in this period");
  var fmt = o.format || function(v){ return num(v); };
  var fmtFull = o.formatFull || fmt;
  var sc = niceScale(Math.max.apply(null, vals), 4);
  var max = sc.max, tks = sc.ticks;
  var slot = iw / n, gap = Math.min(14, slot * 0.34), bw = Math.max(3, slot - gap);
  var yAt = function(v){ return m.t + ih - (v / max) * ih; };

  var grid = tks.map(function(t){
    var y = yAt(t);
    return '<line class="' + (t === 0 ? "axis-line" : "grid-line") + '" x1="' + m.l + '" y1="' + y.toFixed(1)
         + '" x2="' + (w - m.r) + '" y2="' + y.toFixed(1) + '"/>'
         + '<text class="tick" x="' + (m.l - 9) + '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end">' + h(fmt(t)) + '</text>';
  }).join("");

  var every = Math.max(1, Math.ceil(n / (o.maxXLabels || 12)));
  var bars = vals.map(function(v, i){
    var x = m.l + slot * i + (slot - bw) / 2, y = yAt(v), bh = (m.t + ih) - y;
    var col = o.colorAt ? o.colorAt(i) : o.color;
    var lab = (i % every === 0 || i === n - 1)
      ? '<text class="tick" x="' + (x + bw / 2).toFixed(1) + '" y="' + (hgt - 7) + '" text-anchor="middle">' + h(o.labels[i]) + '</text>' : "";
    return '<g class="bar">'
      + '<path class="mark" d="' + roundedTopRect(x, y, bw, bh, 4) + '" fill="' + col + '"/>'
      + lab
      + '<rect class="bar-hit" x="' + (m.l + slot * i).toFixed(1) + '" y="' + m.t + '" width="' + slot.toFixed(1) + '" height="' + ih + '"'
      + tipAttr(o.labels[i], [[col, o.seriesName, fmtFull(v)]].concat(o.extraRows ? o.extraRows(i) : []), o.noteAt ? o.noteAt(i) : "")
      + '></rect></g>';
  }).join("");

  return '<svg class="viz" viewBox="0 0 ' + w + ' ' + hgt + '" role="img" aria-label="' + h(o.aria || o.seriesName) + '">'
    + grid + bars + '</svg>';
}

/* ── 4 · stacked bar chart ─────────────────────────────────────────
   A 2px surface gap separates the segments instead of a stroke. */
function stackedBarChart(o){
  var w = o.width || 780, hgt = o.height || 230, m = { t:14, r:12, b:26, l:o.leftPad || 54 };
  var iw = w - m.l - m.r, ih = hgt - m.t - m.b;
  var n = o.labels.length;
  if (!n) return chartEmpty(o.emptyMsg || "No data in this period");
  var fmt = o.format || function(v){ return num(v); };
  var totals = o.labels.map(function(_, i){
    return o.series.reduce(function(s, ser){ return s + ser.values[i]; }, 0);
  });
  var sc = niceScale(Math.max.apply(null, totals), 4);
  var max = sc.max, tks = sc.ticks;
  var slot = iw / n, gap = Math.min(16, slot * 0.36), bw = Math.max(3, slot - gap);
  var yAt = function(v){ return m.t + ih - (v / max) * ih; };

  var grid = tks.map(function(t){
    var y = yAt(t);
    return '<line class="' + (t === 0 ? "axis-line" : "grid-line") + '" x1="' + m.l + '" y1="' + y.toFixed(1)
         + '" x2="' + (w - m.r) + '" y2="' + y.toFixed(1) + '"/>'
         + '<text class="tick" x="' + (m.l - 9) + '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end">' + h(fmt(t)) + '</text>';
  }).join("");

  var every = Math.max(1, Math.ceil(n / (o.maxXLabels || 12)));
  var cols = o.labels.map(function(lab, i){
    var x = m.l + slot * i + (slot - bw) / 2, acc = 0, segs = "";
    for (var s = o.series.length - 1; s >= 0; s--){
      var ser = o.series[s], v = ser.values[i];
      if (v <= 0) continue;
      var y0 = yAt(acc + v), y1 = yAt(acc), sh = Math.max(0, y1 - y0 - 2); /* 2px surface gap */
      var isTop = acc + v >= totals[i] - 0.0001;
      segs = '<path class="mark" d="' + (isTop ? roundedTopRect(x, y0, bw, sh + 2, 4)
                                               : "M" + x + "," + y0 + "h" + bw + "v" + (sh) + "h" + (-bw) + "Z")
           + '" fill="' + ser.color + '"/>' + segs;
      acc += v;
    }
    var xlab = (i % every === 0 || i === n - 1)
      ? '<text class="tick" x="' + (x + bw / 2).toFixed(1) + '" y="' + (hgt - 7) + '" text-anchor="middle">' + h(lab) + '</text>' : "";
    var rows = o.series.map(function(ser){ return [ser.color, ser.name, (o.formatRow || fmt)(ser.values[i])]; });
    return '<g>' + segs + xlab
      + '<rect class="bar-hit" x="' + (m.l + slot * i).toFixed(1) + '" y="' + m.t + '" width="' + slot.toFixed(1) + '" height="' + ih + '"'
      + tipAttr(lab, rows, o.noteAt ? o.noteAt(i) : ((o.formatRow || fmt)(totals[i]) + " total")) + '></rect></g>';
  }).join("");

  return '<svg class="viz" viewBox="0 0 ' + w + ' ' + hgt + '" role="img" aria-label="' + h(o.aria || "Stacked bar chart") + '">'
    + grid + cols + '</svg>';
}

/* ── 5 · donut ─────────────────────────────────────────────────────
   Part-to-whole at a glance only, capped at 6 segments, with a 2px
   surface gap between arcs and the headline value in the middle. */
function donut(o){
  var size = 200, cx = size / 2, cy = size / 2, R = 86, r = 56;
  var slices = o.slices.filter(function(s){ return s.value > 0; });
  var total = slices.reduce(function(s, x){ return s + x.value; }, 0);
  if (!total) return chartEmpty(o.emptyMsg || "Nothing to show yet");
  var gapDeg = slices.length > 1 ? 1.6 : 0, a = -90, arcs = "";
  var fmt = o.format || function(v){ return num(v); };

  slices.forEach(function(s, i){
    var sweep = (s.value / total) * 360;
    var a0 = a + gapDeg / 2, a1 = a + sweep - gapDeg / 2;
    if (a1 > a0){
      var rad = function(d){ return (d * Math.PI) / 180; };
      var x0 = cx + R * Math.cos(rad(a0)), y0 = cy + R * Math.sin(rad(a0));
      var x1 = cx + R * Math.cos(rad(a1)), y1 = cy + R * Math.sin(rad(a1));
      var x2 = cx + r * Math.cos(rad(a1)), y2 = cy + r * Math.sin(rad(a1));
      var x3 = cx + r * Math.cos(rad(a0)), y3 = cy + r * Math.sin(rad(a0));
      var big = (a1 - a0) > 180 ? 1 : 0;
      arcs += '<path class="arc mark" data-key="' + h(s.id) + '"'
        + ' d="M' + x0.toFixed(1) + ',' + y0.toFixed(1)
        + 'A' + R + ',' + R + ' 0 ' + big + ' 1 ' + x1.toFixed(1) + ',' + y1.toFixed(1)
        + 'L' + x2.toFixed(1) + ',' + y2.toFixed(1)
        + 'A' + r + ',' + r + ' 0 ' + big + ' 0 ' + x3.toFixed(1) + ',' + y3.toFixed(1) + 'Z"'
        + ' fill="' + s.color + '"'
        + tipAttr(s.name, [[s.color, o.unit || "Customers", fmt(s.value)],
                           ["", "Share", (s.value / total * 100).toFixed(1) + "%"]].concat(s.rows || []))
        + '></path>';
    }
    a += sweep;
  });

  return '<svg class="viz" viewBox="0 0 ' + size + ' ' + size + '" style="max-width:220px;margin:0 auto"'
    + ' role="img" aria-label="' + h(o.aria || "Donut chart") + '">'
    + arcs
    + '<text class="center-val" x="' + cx + '" y="' + (cy + 2) + '" text-anchor="middle">' + h(o.centerValue) + '</text>'
    + '<text class="center-lab" x="' + cx + '" y="' + (cy + 20) + '" text-anchor="middle">' + h(o.centerLabel) + '</text>'
    + '</svg>';
}

/* ── 6 · horizontal bars ───────────────────────────────────────────
   Category names read left-to-right, values direct-labelled at the
   bar end — which is also the relief the contrast check asks for. */
function hbarChart(o){
  var rows = o.rows, n = rows.length;
  if (!n) return chartEmpty(o.emptyMsg || "Nothing to show yet");
  var rowH = o.rowH || 38, w = o.width || 560, labW = o.labelWidth || 150, valW = 82;
  var hgt = n * rowH + 6, iw = w - labW - valW - 10;
  var max = Math.max.apply(null, rows.map(function(r){ return r.value; })) || 1;
  var fmt = o.format || function(v){ return num(v); };

  var body = rows.map(function(rw, i){
    var y = i * rowH + 6, bh = 16, bw = Math.max(2, (rw.value / max) * iw);
    return '<g class="hbar">'
      + '<text class="dlabel mut" x="0" y="' + (y + bh / 2 + 4) + '">' + h(rw.name) + '</text>'
      + '<rect x="' + labW + '" y="' + y + '" width="' + iw + '" height="' + bh + '" rx="5" fill="var(--surface-3)"/>'
      + '<path class="mark" d="' + roundedRightRect(labW, y, bw, bh, 5) + '" fill="' + (rw.color || o.color) + '"/>'
      + '<text class="dlabel" x="' + (w - 2) + '" y="' + (y + bh / 2 + 4) + '" text-anchor="end">' + h(fmt(rw.value)) + '</text>'
      + (rw.sub ? '<text class="dlabel mut" x="' + labW + '" y="' + (y + bh + 14) + '" style="font-size:10.5px">' + h(rw.sub) + '</text>' : "")
      + '<rect class="bar-hit" x="0" y="' + y + '" width="' + w + '" height="' + (rowH - 4) + '"'
      + tipAttr(rw.name, (rw.rows || [[rw.color || o.color, o.unit || "Value", fmt(rw.value)]]), rw.note || "") + '></rect>'
      + '</g>';
  }).join("");

  return '<svg class="viz" viewBox="0 0 ' + w + ' ' + hgt + '" role="img" aria-label="' + h(o.aria || "Bar chart") + '">'
    + body + '</svg>';
}

/* ── 7 · legend ────────────────────────────────────────────────────
   Always present for 2+ series, so identity is never colour alone. */
function legend(items, opts){
  opts = opts || {};
  return '<div class="legend' + (opts.stack ? " stack" : "") + '">'
    + items.map(function(it){
        return '<span class="lg-item">'
          + '<i style="background:' + it.color + '"></i>'
          + '<span class="lg-name">' + h(it.name) + '</span>'
          + (it.value != null ? '<span class="lg-val">' + h(it.value) + '</span>' : "")
          + (it.sub ? '<span class="lg-sub">' + h(it.sub) + '</span>' : "")
          + '</span>';
      }).join("")

/* a compact stacked meter for the insight strips */
function miniStack(parts, total){
  if (!total) return '<div class="mini-stack"></div>';
  return '<div class="mini-stack">'
    + parts.filter(function(p){ return p.value > 0; }).map(function(p){
        return '<i style="flex:' + p.value + ';background:' + p.color + '" title="' + h(p.name) + '"></i>';
      }).join("")
    + '</div>';
}
/* a flush 100%-stacked bar + legend — used for "Scheme progress" on
   Overview and "Member progress" on each scheme's page. A single bar
   shows every band's true share of the whole at a glance (five bars
   each scaled to their own max, the old design, could never show
   that). Pass opts.compact for a narrower card: the legend becomes a
   vertical list instead of a 5-column grid, so it never crowds. */
function progressStackedBar(bands, total, opts){
  opts = opts || {};
  if (!total) return chartEmpty("No customers yet");
  var segs = bands.filter(function(b){ return b.n > 0; }).map(function(b){
    var pct = (b.n / total) * 100;
    return '<i style="flex:' + b.n + ';background:' + b.tone + '"'
      + tipAttr(b.name, [[b.tone, "Customers", num(b.n)], ["", "Share", pct.toFixed(1) + "%"]], "")
      + '></i>';
  }).join("");
  var track = '<div class="spbar-track" role="img" aria-label="Scheme progress distribution">' + segs + '</div>';

  if (opts.compact){
    var rows = bands.map(function(b){
      var pct = total ? (b.n / total) * 100 : 0;
      return '<div class="spbar-row">'
        + '<i style="background:' + b.tone + '"></i>'
        + '<span class="spbar-row-name">' + h(b.name) + '</span>'
        + '<span class="spbar-row-val">' + num(b.n) + ' <b>' + pct.toFixed(1) + '%</b></span>'
        + '</div>';
    }).join("");
    return track + '<div class="spbar-rows">' + rows + '</div>';
  }

  var cells = bands.map(function(b){
    var pct = total ? (b.n / total) * 100 : 0;
    return '<div class="spbar-cell" style="--dot:' + b.tone + '">'
      + '<span class="spbar-name">' + h(b.name) + '</span>'
      + '<span class="spbar-val">' + num(b.n) + '<span>' + pct.toFixed(1) + '%</span></span>'
      + '</div>';
  }).join("");
  return track + '<div class="spbar-legend">' + cells + '</div>';
}
function deltaBadge(v, opts){
  opts = opts || {};
  if (v == null) return '<span class="delta flat">—</span>';
  var up = v > 0.05, down = v < -0.05;
  var good = opts.invert ? down : up;
  var cls = (!up && !down) ? "flat" : (good ? "up" : "down");
  var arrow = (!up && !down) ? "" : (up ? "↑" : "↓");
  return '<span class="delta ' + cls + '">' + arrow + " " + Math.abs(v).toFixed(1) + '%</span>';
}

function th(label, key, active, dir, isNum, sortable){
  var cls = (isNum ? "num " : "") + (sortable ? "sortable " : "") + (active ? "sorted" : "");
  var ico = active ? icon(dir === "asc" ? "sortUp" : "sortDown", 13, "sort-ico")

  var attrs = sortable ? ' data-act="sort" data-key="' + key + '" tabindex="0" role="button" aria-label="Sort by ' + h(label) + '"' : "";
  return '<th class="' + cls.trim() + '"' + attrs + (active ? ' aria-sort="' + (dir === "asc" ? "ascending" : "descending") + '"' : "")
       + '><span class="th-in">' + h(label) + ico + '</span></th>';

function pager(total, page, per, label){
  var pages = Math.max(1, Math.ceil(total / per));
  if (total === 0) return "";
  var from = (page - 1) * per + 1, to = Math.min(total, page * per);
  var btns = '<button class="pg" data-act="page" data-page="' + (page - 1) + '" ' + (page <= 1 ? "disabled" : "")
           + ' aria-label="Previous page">' + icon("chevLeft", 15) + '</button>';
  var list = [], i;
  if (pages <= 7){ for (i = 1; i <= pages; i++) list.push(i); }
  else {
    list.push(1);
    var s = Math.max(2, page - 1), e = Math.min(pages - 1, page + 1);
    if (s > 2) list.push("…");
    for (i = s; i <= e; i++) list.push(i);
    if (e < pages - 1) list.push("…");
    list.push(pages);
  }
  list.forEach(function(p){
    btns += (p === "…") ? '<span class="pg-gap">…</span>'
      : '<button class="pg' + (p === page ? " cur" : "") + '" data-act="page" data-page="' + p + '"'
        + (p === page ? ' aria-current="page"' : "") + '>' + p + '</button>';
  });
  btns += '<button class="pg" data-act="page" data-page="' + (page + 1) + '" ' + (page >= pages ? "disabled" : "")
       + ' aria-label="Next page">' + icon("chevRight", 15) + '</button>';
  return '<div class="pager"><span class="pager-info">Showing <b>' + from + '–' + to + '</b> of <b>' + num(total)
       + '</b> ' + h(label) + '</span><div class="pager-btns">' + btns + '</div></div>';
}

function schemeOptions(sel){
  return '<option value="">All schemes</option>' + SCHEMES.map(function(s){

function statusOptions(list, sel){
